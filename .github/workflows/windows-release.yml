name: Windows Installer and Automatic Updates
on:
  push:
    branches: [main]
    paths:
      - 'renderer/**'
      - 'main.cjs'
      - 'desktop-logic.cjs'
      - 'package.json'
      - 'scripts/**'
      - 'test/**'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testar código
        run: npm run check
      - name: Definir versão nova e crescente
        run: node scripts/set-ci-version.cjs
      - name: Gerar instalador NSIS e publicar atualização
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: GITHUB_TOKEN_LITERAL
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Evolucao-Art-Windows-${{ github.run_number }}
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
