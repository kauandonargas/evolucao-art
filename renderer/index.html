<title>Evolução Art</title>
<style>
:root{
  color-scheme:dark;
  --bg:#101110;--paper:#181a18;--paper-2:#20231f;--ink:#f1f3ef;--muted:#9ca19a;--line:#30342f;
  --green:#5f9b72;--green-soft:#1c3525;--green-line:#356044;--dark:#2a2e29;--shadow:0 18px 55px rgba(0,0,0,.28);
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.hidden{display:none!important}
.shell{min-height:100vh}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:rgba(16,17,16,.92);backdrop-filter:blur(10px);position:sticky;top:0;z-index:8}
.brand{font-family:Georgia,serif;font-size:21px}.back{border:0;background:transparent;color:var(--muted);padding:8px 0}.back:hover{color:var(--ink)}
main{width:min(1120px,calc(100% - 36px));margin:0 auto;padding:52px 0 90px}.hero{max-width:720px;margin-bottom:34px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:750;color:var(--muted)}
h1,h2,h3{font-family:Georgia,serif;font-weight:500}h1{font-size:48px;line-height:1.02;margin:8px 0 12px}h2{font-size:30px;margin:0}h3{font-size:21px;margin:0}.lead{color:var(--muted);line-height:1.65;margin:0}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.choice{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:24px;min-height:260px;padding:28px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:.18s}.choice:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#444a43}.choice .num{color:var(--muted);font-size:12px}.choice h2{font-size:34px}.choice p{color:var(--muted);line-height:1.55;margin:8px 0 0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:1px solid var(--line);background:var(--paper-2);color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:700}.btn:hover{border-color:#4a5049}.btn.primary{background:#2c312d;border-color:#3b413b;color:var(--ink)}.btn.green{background:var(--green);border-color:var(--green);color:#08110b}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px}.section-head p{margin:5px 0 0;color:var(--muted)}.cards{display:grid;gap:12px}.card{border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:20px}.clickable{cursor:pointer;transition:.15s}.clickable:hover{transform:translateY(-1px);box-shadow:var(--shadow);border-color:#444a43}.done{background:var(--green-soft);border-color:var(--green-line)}.row{display:flex;gap:14px;justify-content:space-between;align-items:center}.grow{flex:1;min-width:0}.title-line{font-weight:800}.meta{font-size:13px;color:var(--muted);line-height:1.55}.targets{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:5px 9px;background:var(--paper-2)}.done .pill{background:#24402d;border-color:#3b6648}.empty{border:1px dashed #3d423d;border-radius:20px;padding:44px 20px;text-align:center;color:var(--muted);background:rgba(24,26,24,.55)}

.field{display:grid;gap:7px;margin-bottom:13px}.field label{font-size:12px;font-weight:800;color:#b4b9b2}.input,.textarea,.select{width:100%;border:1px solid var(--line);background:#121412;color:var(--ink);border-radius:11px;padding:11px 12px;outline:none}.input::placeholder,.textarea::placeholder{color:#6f756e}.input:focus,.textarea:focus,.select:focus{border-color:#596159;box-shadow:0 0 0 3px rgba(95,155,114,.12)}

.note{border:1px solid var(--line);border-radius:14px;background:#121412;padding:12px}.note+.note{margin-top:8px}.note-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.note p{margin:7px 0 0;line-height:1.5;color:#c7ccc5;font-size:13px;white-space:pre-wrap}.star{border:0;background:transparent;color:#666c65;font-size:19px;padding:0}.star.on{color:#d2b468}.fav{border-left:3px solid #9d824c;padding:7px 0 7px 12px;margin:7px 0;font-family:Georgia,serif;line-height:1.45}

dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:#0c0d0c;color:#fff;max-width:min(96vw,1100px)}dialog::backdrop{background:rgba(0,0,0,.88)}dialog img{display:block;max-width:94vw;max-height:88vh;object-fit:contain}.dialog-bar{display:flex;justify-content:flex-end;padding:8px}.dialog-bar button{border:1px solid #353a35;background:#171917;color:#fff;border-radius:9px;padding:7px 10px}
@media(max-width:850px){main{padding-top:34px}.choice-grid,.split,.practice-grid{grid-template-columns:1fr}.foundation-grid{grid-template-columns:1fr 1fr}.topbar{padding:0 18px}h1{font-size:40px}.art img{height:260px}}
@media(max-width:560px){.foundation-grid,.art-grid,.counter-grid{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.choice{min-height:210px}.choice h2{font-size:30px}.row{align-items:flex-start}.topbar{height:62px}.brand{font-size:17px}}

/* Image-first layout */
main{width:min(1680px,calc(100% - 28px));padding:32px 0 72px}.hero{margin-bottom:22px;max-width:900px}.hero h1{font-size:clamp(34px,4vw,58px)}
.image-page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px}.image-page-head .hero{margin:0}.status-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status-chip{border:1px solid var(--line);background:rgba(24,26,24,.82);border-radius:999px;padding:7px 11px;font-size:12px;color:#c9cec7}.status-chip strong{color:#fff}.status-chip.complete{background:var(--green-soft);border-color:var(--green-line);color:#9dccaa}
.exercise-controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:12px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}.exercise-controls .field{margin:0;min-width:170px}.exercise-controls .upload-inline{flex:1;min-width:260px}.exercise-controls label{font-size:11px}.exercise-controls input[type=file]{padding:8px;background:transparent}
.image-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}.study-art{position:relative;border:1px solid var(--line);border-radius:14px;background:#090a09;overflow:hidden}.study-art button.image-button{all:unset;display:block;cursor:zoom-in;width:100%}.study-art img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;background:#090a09}.study-meta{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 11px;background:#141614;border-top:1px solid #242724;font-size:12px;color:var(--muted)}.study-type{color:#daddd8}.study-remove{border:0;background:transparent;color:#777d76;padding:2px 4px}.study-remove:hover{color:#fff}.gallery-empty{min-height:46vh;border:1px dashed #343934;border-radius:16px;display:grid;place-items:center;text-align:center;color:var(--muted);background:#0d0f0d}
.exercise-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.exercise-tile{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#111311;cursor:pointer;transition:.15s}.exercise-tile:hover{border-color:#4a5049;transform:translateY(-1px)}.exercise-tile.done{border-color:var(--green-line)}.exercise-cover{height:300px;background:#090a09;display:grid;place-items:center;overflow:hidden}.exercise-cover img{width:100%;height:100%;object-fit:contain}.exercise-cover .cover-empty{font-size:12px;color:#555c55}.exercise-tile-info{padding:14px 15px;display:flex;justify-content:space-between;gap:12px;align-items:center}.exercise-tile-title{font-size:17px;font-weight:750}.exercise-tile-counts{font-size:12px;color:var(--muted);margin-top:4px}.exercise-tile.done .exercise-tile-title{color:#9dccaa}
.foundation-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}.foundation-main{min-width:0}.foundation-sidebar{position:sticky;top:88px;display:grid;gap:12px}.foundation-art-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}.foundation-art-head h2{font-size:28px}.foundation-info{border:1px solid var(--line);background:#151715;border-radius:16px;padding:16px}.foundation-info h3{font-size:18px}.foundation-info .body{font-size:14px;line-height:1.6}.foundation-notes{border:1px solid var(--line);background:#151715;border-radius:16px;padding:16px}.favorite-bar{display:flex;gap:8px;overflow:auto;padding:0 0 12px;margin-bottom:12px}.favorite-bar .fav{min-width:260px;max-width:420px;border:1px solid #4d422a;border-left:3px solid #9d824c;background:#171713;border-radius:10px;padding:10px 12px;margin:0;font-family:inherit;font-size:12px;color:#d8d0bb}.art-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.art{border-radius:14px}.art img{height:auto;max-height:82vh;object-fit:contain}.art-cap{background:#141614;border-top:1px solid #242724;padding:8px 10px}
.overlay{padding:10px;background:rgba(0,0,0,.86)}.modal{width:min(1600px,100%);margin:0 auto;min-height:calc(100vh - 20px);border-radius:18px}.modal-body{padding:14px 16px 18px}.modal-head{padding:12px 16px}.steps{margin-bottom:12px}.practice-grid{grid-template-columns:minmax(0,1.45fr) minmax(320px,.55fr);gap:14px}.practice-visual{background:#080908;border:1px solid var(--line);border-radius:14px;min-height:65vh;display:grid;place-items:center;overflow:hidden}.practice-visual img{display:block;max-width:100%;max-height:calc(100vh - 190px);width:auto;height:auto;object-fit:contain}.practice-side{display:flex;flex-direction:column;gap:12px}.practice-side .upload{padding:12px}.preview{max-height:58vh;border-radius:8px}.compare-wall{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}.compare-wall .practice-visual{min-height:56vh}.compare-label{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.72);border:1px solid #383d38;border-radius:999px;padding:5px 8px;font-size:11px;color:#ddd}.visual-wrap{position:relative}.no-reference{height:auto;min-height:65vh;background:#0a0b0a}
@media(max-width:1050px){.image-gallery,.art-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.foundation-layout{grid-template-columns:1fr}.foundation-sidebar{position:static}.practice-grid{grid-template-columns:1fr}.practice-visual{min-height:48vh}.compare-wall{grid-template-columns:1fr}.exercise-cards{grid-template-columns:1fr}}
@media(max-width:620px){main{width:min(100% - 18px,1680px);padding-top:18px}.image-gallery,.art-grid{grid-template-columns:1fr}.exercise-cover{height:240px}.exercise-controls{align-items:stretch}.exercise-controls>*{width:100%!important}.image-page-head{align-items:flex-start;flex-direction:column}.foundation-art-head{align-items:flex-start;flex-direction:column}.practice-visual{min-height:42vh}.modal{min-height:calc(100vh - 10px)}}



/* Exercise workspace — image first, drag only */
.exercise-workspace{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 190px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);animation:workspaceIn .42s cubic-bezier(.2,.8,.2,1)}
.exercise-zone{position:relative;min-width:0;padding:18px 18px 40px;transition:background .22s ease,box-shadow .22s ease}
.exercise-zone+ .exercise-zone{border-left:1px solid var(--line)}
.exercise-zone.dragging{background:rgba(95,155,114,.07);box-shadow:inset 0 0 0 1px rgba(95,155,114,.36)}
.zone-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 2px 16px;position:sticky;top:72px;z-index:3;background:linear-gradient(to bottom,var(--bg) 72%,rgba(16,17,16,0));backdrop-filter:blur(8px)}
.zone-title{display:flex;align-items:baseline;gap:10px}.zone-title h2{font-size:24px}.zone-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.drop-hint{font-size:11px;color:#666d66;transition:color .2s ease,transform .2s ease}.exercise-zone.dragging .drop-hint{color:#9dccaa;transform:translateY(-1px)}
.zone-gallery{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.zone-empty{min-height:58vh;display:grid;place-items:center;text-align:center;color:#555c55;border:1px dashed transparent;border-radius:18px;transition:border-color .22s ease,color .22s ease,transform .22s ease;background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.018),transparent 48%)}
.zone-empty strong{display:block;color:#727a72;font-weight:600;margin-bottom:7px}.exercise-zone.dragging .zone-empty{border-color:#42604a;color:#8fb49a;transform:scale(.995)}
.zone-art{position:relative;background:#090a09;border-radius:14px;overflow:hidden;border:1px solid #242724;animation:artIn .34s cubic-bezier(.2,.8,.2,1) both;transform-origin:center top}
.zone-art .image-button{all:unset;display:block;width:100%;cursor:zoom-in}.zone-art img{display:block;width:100%;height:auto;max-height:82vh;object-fit:contain;background:#090a09}
.zone-art .study-remove{position:absolute;right:10px;top:10px;width:30px;height:30px;border:1px solid rgba(255,255,255,.09);border-radius:999px;background:rgba(10,11,10,.72);backdrop-filter:blur(8px);color:#a6aca5;opacity:0;transform:translateY(-4px);transition:opacity .16s ease,transform .16s ease,background .16s ease,color .16s ease}.zone-art:hover .study-remove{opacity:1;transform:none}.zone-art .study-remove:hover{background:rgba(28,31,28,.94);color:#fff}
.exercise-header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:2px 2px 18px}.exercise-header .hero{margin:0}.exercise-header h1{margin-bottom:0}.exercise-status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.exercise-status .status-chip{background:transparent;border-color:#292d29}.exercise-status .status-chip.complete{background:var(--green-soft);border-color:var(--green-line)}
@keyframes workspaceIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes artIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@media(max-width:820px){.exercise-workspace{grid-template-columns:1fr}.exercise-zone+ .exercise-zone{border-left:0;border-top:1px solid var(--line)}.zone-head{top:62px}.exercise-header{align-items:flex-start;flex-direction:column}.exercise-status{justify-content:flex-start}.zone-empty{min-height:34vh}}
@media(prefers-reduced-motion:reduce){.exercise-workspace,.zone-art{animation:none}.exercise-zone,.drop-hint,.zone-empty,.study-remove{transition:none}}



/* Visual refinement — quiet, image-led, dark only */
:root{
  --bg:#080909;--paper:#0f1010;--paper-2:#151616;--ink:#f4f4f1;--muted:#858a84;--line:#202220;
  --green:#78ad83;--green-soft:#142219;--green-line:#294331;--shadow:0 24px 70px rgba(0,0,0,.38);
}
html{background:#080909}
body{background:radial-gradient(1100px 700px at 50% -180px,#171a18 0,#0b0c0b 42%,#080909 72%);letter-spacing:-.01em}
body,button,input,textarea,select{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
h1,h2,h3,.brand{font-family:inherit;font-weight:620;letter-spacing:-.035em}
.topbar{height:58px;border:0;padding:0 22px;background:rgba(8,9,9,.72);box-shadow:0 1px 0 rgba(255,255,255,.035);backdrop-filter:blur(18px) saturate(120%)}
.brand{font-size:13px;font-weight:600;color:#b9bdb8;letter-spacing:-.01em}.back{font-size:13px;color:#777c76}.back:hover{color:#eceeea}
main{width:min(1800px,calc(100% - 24px));padding:26px 0 64px}.hero{margin-bottom:20px}.eyebrow{font-size:10px;letter-spacing:.12em;color:#666b65;font-weight:700}h1{font-size:clamp(32px,4vw,54px);line-height:1;margin:7px 0 10px}h2{font-size:26px}.lead{color:#8d928c}

/* buttons / inputs */
.btn{border:0;background:#171918;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:650;box-shadow:inset 0 0 0 1px rgba(255,255,255,.055);transition:transform .18s ease,background .18s ease,box-shadow .18s ease}
.btn:hover{transform:translateY(-1px);background:#1d1f1e;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}.btn.primary{background:#f0f1ed;color:#101110;box-shadow:none}.btn.primary:hover{background:#fff}.btn.green{background:#8fbd98;color:#071009;box-shadow:none}
.input,.textarea,.select{border:0;background:#111312;border-radius:13px;padding:12px 13px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.055)}.input:focus,.textarea:focus,.select:focus{box-shadow:inset 0 0 0 1px #566159,0 0 0 3px rgba(120,173,131,.08)}
.panel,.card{border:0;background:#101111;border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.035)}
.empty{border:0;background:#0d0e0e;border-radius:18px;color:#666b65}

/* home and section choices */
.choice-grid{gap:12px}.choice{border:0;background:linear-gradient(145deg,#111312,#0d0e0e);border-radius:22px;min-height:250px;padding:24px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);transition:transform .28s cubic-bezier(.2,.8,.2,1),background .28s ease,box-shadow .28s ease}
.choice:hover{transform:translateY(-3px);background:linear-gradient(145deg,#151715,#101110);box-shadow:0 22px 60px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.055)}.choice h2{font-size:32px}.choice p{max-width:440px;color:#787d77}.choice .num{color:#5c615b}
.section-head{margin-bottom:14px}.section-head p{color:#777c76;font-size:13px}

/* exercise list: artwork as the card */
.exercise-cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.exercise-tile{border:0;border-radius:18px;background:#0d0e0e;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.035);transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s ease}.exercise-tile:hover{transform:translateY(-3px);box-shadow:0 22px 50px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.06)}.exercise-tile.done{box-shadow:inset 0 0 0 1px rgba(120,173,131,.34)}
.exercise-cover{height:clamp(240px,32vw,430px);background:#0b0c0c}.exercise-cover img{object-fit:contain;transition:transform .45s cubic-bezier(.2,.8,.2,1)}.exercise-tile:hover .exercise-cover img{transform:scale(1.012)}.exercise-cover .cover-empty{color:#484d48}.exercise-tile-info{padding:13px 14px 14px}.exercise-tile-title{font-size:15px;font-weight:650}.exercise-tile-counts{font-size:11px;color:#6d726c}.status-chip{border:0;background:#121413;border-radius:999px;padding:6px 9px;font-size:11px;color:#8b908a}.status-chip.complete{background:#142219;color:#9dcca7}

/* exercise screen: two quiet canvases, almost no chrome */
.exercise-header{padding:0 4px 12px;align-items:center}.exercise-header .eyebrow{display:none}.exercise-header h1{font-size:clamp(24px,2.7vw,38px);margin:0}.exercise-status{gap:6px}.exercise-status .status-chip{background:transparent!important;border:0!important;padding:5px 7px;color:#70756f}.exercise-status .status-chip.complete{color:#8fbd98}
.exercise-workspace{min-height:calc(100vh - 118px);border:0;gap:10px;animation:workspaceIn .5s cubic-bezier(.16,1,.3,1)}
.exercise-zone{padding:0 12px 28px;background:rgba(16,17,17,.6);border-radius:20px;overflow:clip;box-shadow:inset 0 0 0 1px rgba(255,255,255,.028);transition:background .2s ease,box-shadow .2s ease,transform .2s ease}
.exercise-zone+.exercise-zone{border:0}.exercise-zone.dragging{background:#111a14;box-shadow:inset 0 0 0 1px rgba(120,173,131,.32);transform:scale(.997)}
.zone-head{top:58px;padding:15px 5px 12px;background:linear-gradient(to bottom,rgba(16,17,17,.96) 68%,rgba(16,17,17,0));backdrop-filter:blur(12px)}.zone-title{gap:8px}.zone-title h2{font-size:15px;font-weight:650;letter-spacing:-.015em}.zone-count{font-size:11px;color:#5f645e}.drop-hint{font-size:10px;color:#50554f}.exercise-zone.dragging .drop-hint{color:#9bc6a3;transform:none}
.zone-gallery{gap:10px}.zone-empty{min-height:calc(100vh - 190px);border:0;border-radius:14px;background:transparent;color:#4b504b;transition:color .2s ease,transform .2s ease}.zone-empty strong{font-size:13px;color:#656a64;font-weight:600}.exercise-zone.dragging .zone-empty{border:0;color:#88b391;transform:scale(.992)}
.zone-art{border:0;border-radius:12px;background:#090a0a;box-shadow:0 12px 34px rgba(0,0,0,.24);animation:artIn .48s cubic-bezier(.16,1,.3,1) both}.zone-art img{background:#090a0a;max-height:84vh;transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s ease}.zone-art:hover img{transform:scale(1.006)}
.zone-art .study-remove{right:9px;top:9px;width:28px;height:28px;border:0;background:rgba(8,9,9,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);opacity:0;transform:scale(.9);transition:opacity .18s ease,transform .18s ease,background .18s ease}.zone-art:hover .study-remove{opacity:1;transform:scale(1)}

/* master pages: less dashboard, more gallery */
.foundation-grid{gap:12px}.foundation{border:0;background:#101111}.foundation-layout{gap:14px}.foundation-art{padding:0}.art-grid{gap:10px}.art{border:0;border-radius:14px;background:#090a0a;box-shadow:0 10px 28px rgba(0,0,0,.22)}.art img{background:#090a0a}.art-cap{background:#101111;border:0;color:#737872}.foundation-sidebar .panel{background:#0f1010}.note{border:0;background:#121313;border-radius:12px}.fav{border-left-color:#5f705f}

/* overlays and image viewing */
.overlay{background:rgba(0,0,0,.8);backdrop-filter:blur(16px)}.modal{border:0;background:#0d0e0e;border-radius:22px;box-shadow:0 40px 100px rgba(0,0,0,.55)}.modal-head{border-bottom:1px solid rgba(255,255,255,.05)}
dialog{border:0;border-radius:18px;background:#070808;box-shadow:0 40px 100px rgba(0,0,0,.65);animation:dialogIn .25s cubic-bezier(.16,1,.3,1)}dialog::backdrop{background:rgba(0,0,0,.92);backdrop-filter:blur(10px)}.dialog-bar{position:absolute;right:0;z-index:2}.dialog-bar button{border:0;background:rgba(15,16,16,.72);backdrop-filter:blur(8px);border-radius:999px}

/* subtle page motion */
#app.page-enter{animation:pageEnter .38s cubic-bezier(.16,1,.3,1)}
@keyframes pageEnter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes workspaceIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes artIn{0%{opacity:0;transform:translateY(14px) scale(.975);filter:blur(4px)}100%{opacity:1;transform:none;filter:none}}
@keyframes dialogIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

@media(max-width:1100px){.exercise-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.exercise-workspace{gap:10px}.exercise-zone+.exercise-zone{border:0}.zone-head{top:58px}.zone-empty{min-height:35vh}}
@media(max-width:620px){main{width:calc(100% - 14px);padding-top:18px}.topbar{padding:0 12px}.brand{max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.exercise-cards{grid-template-columns:1fr}.exercise-header{padding-inline:2px}.exercise-zone{border-radius:16px;padding-inline:8px}}
@media(prefers-reduced-motion:reduce){#app.page-enter,dialog,.zone-art,.exercise-workspace{animation:none}.choice,.exercise-tile,.btn,.zone-art img,.exercise-zone{transition:none}}


/* Social-feed refinement — compact artwork posts */
.exercise-workspace{
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:0;
  background:transparent;
}
.exercise-zone{
  border-radius:0;

  box-shadow:none;

}

  background:rgba(120,173,131,.035);

  transform:none;
}
.zone-head{
  width:min(100%,460px);
  margin:0 auto;
  padding:13px 2px 12px;
  background:linear-gradient(to bottom,rgba(8,9,9,.98) 76%,rgba(8,9,9,0));
}
.zone-title h2{font-size:13px;font-weight:650}.zone-count{font-size:10px}.drop-hint{font-size:10px}
.zone-gallery{

  background:rgba(120,173,131,.035);
  box-shadow:inset 0 0 0 1px rgba(120,173,131,.18);

  padding:7px;
  background:#101111;
  box-shadow:0 10px 30px rgba(0,0,0,.24),inset 0 0 0 1px rgba(255,255,255,.045);

  animation:feedPostIn .42s cubic-bezier(.16,1,.3,1) both;

  border-radius:13px;

}

}
.zone-art .study-remove{right:14px;top:14px}
.exercise-header{
  width:min(100%,980px);
  margin:0 auto;
  padding-bottom:14px;
}
@keyframes feedPostIn{
  from{opacity:0;transform:translateY(12px) scale(.985)}
  to{opacity:1;transform:none}
}
@media(max-width:980px){
  .exercise-zone{padding-inline:14px}
  .zone-head,.zone-gallery{width:min(100%,420px)}
  .zone-art img{max-height:520px}
}

  .exercise-workspace{grid-template-columns:1fr;gap:24px}
  .exercise-zone+.exercise-zone{border-left:0;border-top:1px solid rgba(255,255,255,.055)}
  .zone-head,.zone-gallery{width:min(100%,520px)}
  .zone-empty{min-height:220px}

.difficulty-picker{display:flex;gap:8px;margin-top:5px}.difficulty-option{flex:1;position:relative}.difficulty-option input{position:absolute;opacity:0;pointer-events:none}.difficulty-option span{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:12px;background:#111312;color:#777d77;box-shadow:inset 0 0 0 1px rgba(255,255,255,.055);font-size:12px;font-weight:650;cursor:pointer;transition:background .16s ease,color .16s ease,box-shadow .16s ease,transform .16s ease}.difficulty-option span:hover{color:#c5cac5;background:#141615}.difficulty-option input:checked+span{color:#e7ebe7;box-shadow:inset 0 0 0 1px rgba(255,255,255,.13);transform:translateY(-1px)}.difficulty-option.easy input:checked+span{background:#102017;color:#a7d4b0}.difficulty-option.medium input:checked+span{background:#211b0f;color:#dfc58c}.difficulty-option.hard input:checked+span{background:#241313;color:#dca0a0}

/* Reference pairing + duplicate feedback */

.exercise-focus-map{margin-top:11px;border-top:1px solid #1f221f;padding-top:10px}.exercise-focus-map summary{cursor:pointer;color:#7f857f;font-size:11px;list-style:none}.exercise-focus-map summary::-webkit-details-marker{display:none}.focus-link-grid{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.focus-link-toggle{border:1px solid #252925;background:#101211;color:#747a74;border-radius:999px;padding:7px 10px;font-size:11px}.focus-link-toggle.on{background:#132018;border-color:#2e4a36;color:#a7d4b0}
.focus-editor{display:grid;grid-template-columns:minmax(320px,.72fr) minmax(420px,1.28fr);gap:16px;align-items:start}.focus-editor-form{border:1px solid var(--line);background:#0e100f;border-radius:18px;padding:18px}.focus-editor-form h2{font-size:22px;margin-bottom:16px}.focus-editor-media{border:1px solid var(--line);background:#0b0c0c;border-radius:18px;padding:12px;min-height:560px}.focus-dropzone{min-height:180px;border:1px dashed #303630;border-radius:15px;background:radial-gradient(circle at 50% 35%,rgba(120,173,131,.05),transparent 55%);display:grid;place-items:center;text-align:center;padding:22px;color:#666d66;transition:.16s ease}.focus-dropzone.dragging{border-color:#4c7659;background:rgba(120,173,131,.06);color:#a4c9ac}.focus-dropzone strong{display:block;color:#aeb4ae;margin-bottom:6px;font-size:13px}.focus-dropzone input{display:none}.focus-preview-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.focus-preview-card{position:relative;border:1px solid #232623;border-radius:13px;overflow:hidden;background:#080909;min-height:180px;display:grid;place-items:center}.focus-preview-card img{display:block;width:100%;height:100%;max-height:330px;object-fit:contain;background:#080909}.focus-preview-card .x{opacity:0;transition:.15s}.focus-preview-card:hover .x{opacity:1}.focus-preview-badge{position:absolute;left:8px;bottom:8px;background:rgba(8,9,9,.78);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:4px 7px;font-size:9px;color:#9aa09a}.focus-editor-hint{font-size:11px;color:#5f655f;line-height:1.5;margin-top:9px}.focus-save-row{display:flex;gap:8px;align-items:center;margin-top:16px}
.focus-visual>button{all:unset;cursor:zoom-in;display:grid;place-items:center;width:100%;height:100%;background:#090a0a}.focus-visual>button img{display:block;width:100%;height:100%;max-height:76vh;object-fit:contain}.focus-visual.multi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:#1a1d1a;min-height:62vh}.focus-visual.multi button{all:unset;cursor:zoom-in;background:#090a0a;display:grid;place-items:center;min-height:250px;overflow:hidden}.focus-visual.multi img{width:100%;height:100%;max-height:38vh;object-fit:contain}.focus-library-image.multi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px}.focus-library-image.multi img{max-height:130px}.focus-library-image .more-count{display:grid;place-items:center;background:#0f1110;color:#777d77;font-size:12px}

/* Evolução Art v7: minimal image-first treatment. Visual-only changes. */
:root {
  --bg:#121313;
  --paper:#191a1a;
  --paper-2:#202121;
  --ink:#e8e9e7;
  --muted:#969995;
  --line:#323434;
  --green:#84aa8b;
  --green-soft:#222a23;
  --green-line:#39473b;
  --shadow:none;
}
html,body {background:var(--bg)!important;color:var(--ink);letter-spacing:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body {background-image:none!important}
h1,h2,h3,.brand,.counter strong,.focus-command strong,.focus-library-body h3,
.focus-copy h2,.ea-focus-preview strong,.ea-finish h2,.ea-setup h2,.ea-panel h3,
.guided-main h2,.zone-title h2,.focus-empty h2,.ea-rating-panel h3,
.daily-complete h2,.ea-master-rec h3,.focus-editor-form h2 {
  font-family:inherit!important;letter-spacing:-.012em!important;font-weight:550!important;
}
h1,.hero h1{font-size:clamp(25px,2.2vw,34px)!important;line-height:1.25;margin:4px 0 6px!important}
h2{font-size:21px!important;line-height:1.3}
h3{font-size:17px!important;line-height:1.4}
.eyebrow {font-size:11px;letter-spacing:0;text-transform:none;font-weight:450;color:#8b8e89}
.lead,.hero p {font-size:13px;line-height:1.5;color:var(--muted)}
.topbar {height:56px;background:#121313;border:0;border-bottom:1px solid #292b2b;backdrop-filter:none;box-shadow:none;padding:0 27px}
.brand {font-size:14px;font-weight:550!important;color:#c8cbc6;letter-spacing:0!important}
.back {font-size:13px;color:#a4a7a2}.back:hover{color:var(--ink)}
main {width:min(1280px,calc(100% - 64px));padding:30px 0 72px}
.hero {margin-bottom:22px;max-width:850px}
.section-head {margin-bottom:14px}.section-head p{font-size:12px}
/* Flat, legible controls; one intentional color accent. */
.btn,.btn.primary,.btn.green,.ea-small-focus-link,.ea-quiet-controls button,
.ea-master-tag-list button,.focus-link-toggle,.focus-rating button,
.ea-rating-buttons button,.ea-focus-nav button,.ea-intensity button,
.home-train-now,.focus-preview-remove {
  border-radius:7px!important;box-shadow:none!important;transition:background .12s ease,border-color .12s ease,color .12s ease!important;transform:none!important;
}
.btn,.btn.primary,.ea-small-focus-link,.ea-quiet-controls button,
.ea-master-tag-list button {background:#242525;color:#dbddda;border:1px solid #383b39;font-weight:500;font-size:12px;padding:9px 12px}
.btn:hover,.btn.primary:hover,.ea-small-focus-link:hover,.ea-quiet-controls button:hover,
.ea-master-tag-list button:hover {background:#2a2c2a;border-color:#585b57;transform:none!important}
.btn.green,.home-train-now {background:var(--green)!important;color:#101811!important;border:1px solid var(--green)!important;font-weight:600}
.btn.green:hover,.home-train-now:hover {background:#96b99d!important;transform:none!important;box-shadow:none!important}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible {
  outline:2px solid #b0cdb5!important;outline-offset:2px;
}
.input,.textarea,.select {background:#171818;border:1px solid #383a38;border-radius:6px;box-shadow:none;padding:11px 12px}
.input:focus,.textarea:focus,.select:focus{box-shadow:none;border-color:#849287}
.field label {font-size:12px;color:#aaada8;font-weight:500}
.meta {color:#969995}
/* Home: short options, no decorative numbers or oversized cards. */
.choice-grid {gap:10px}
.home-grid {grid-template-columns:repeat(3,minmax(0,1fr))}
.choice,.card,.panel,.foundation,.ea-panel,.ea-setup,.ea-finish,
.guided-launch,.guided-main,.guided-status,.daily-complete,.focus-editor-form,.focus-editor-media,

/* The current principle is a quiet image-led item, not a colored callout. */
.ea-focus-preview {margin-bottom:18px;padding:12px 14px;gap:14px;background:#191a1a!important}

.guided-launch {display:none!important}

.ea-master-tag-list button {color:#c8cbc6}
/* Images fill the visual role, controls get out of the way. */
.exercise-tile,.focus-library-item {overflow:hidden}
.exercise-cards {grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

.art,.study-art,.zone-art,.focus-visual,.focus-library-image,.exercise-cover,.focus-form-preview,

<script>
'use strict';
/* BEGIN EA_IMPORT_CORE_v1: shared by Node tests and the browser (embedded). */
const EvolucaoImport = (() => {
  const schema = 'evolucao-art.import/v1';
  const fields = {
    root:['schema','packageId','name','foundations','focuses','exercises'],
    foundation:['key','name','master','courseUrl','complexity','focusKeys'],
    focus:['key','title','concept','microSkill','courseUrl'],
    exercise:['key','title','area','foundationKey','focusKeys','difficulty','withReference','withoutReference','instructions']
  };
  const keyPattern = /^[a-z0-9][a-z0-9_-]{0,63}$/;
  const MAX = 1000;
  const plain = v => v!==null && typeof v==='object' && !Array.isArray(v) && (Object.getPrototypeOf(v)===Object.prototype||Object.getPrototypeOf(v)===null);
  const text = v => typeof v==='string'?v.trim():'';
  const folded = v => text(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR').replace(/\s+/g,' ');
  function error(message){throw new Error(message)}
  function keysOnly(value,kind,where){for(const key of Object.keys(value))if(!fields[kind].includes(key))error(`${where}: campo não suportado "${key}". Nenhuma informação será ignorada.`)}
  function str(value,where,max=6000,required=true){if(value!==undefined&&value!==null&&typeof value!=='string')error(`${where}: precisa ser texto.`);const v=text(value);if(required&&!v)error(`${where}: obrigatório.`);if(v.length>max)error(`${where}: limite de ${max} caracteres.`);return v}
  function key(value,where){const k=str(value,where,64);if(!keyPattern.test(k))error(`${where}: use letras minúsculas, números, _ ou -, começando por letra/número.`);return k}
  function url(value,where){const v=str(value??'',where,1000,false);if(!v)return '';let p;try{p=new URL(v)}catch{error(`${where}: endereço inválido.`)}if(!['http:','https:'].includes(p.protocol))error(`${where}: somente http:// ou https://.`);return p.href}
  function integer(value,where,lo,hi,defaultValue){if(value===undefined)return defaultValue;if(!Number.isInteger(value)||value<lo||value>hi)error(`${where}: informe inteiro entre ${lo} e ${hi}.`);return value}
  function array(value,where){if(value===undefined)return [];if(!Array.isArray(value))error(`${where}: precisa ser uma lista.`);return value}
  function linkKeys(value,where){const a=array(value,where);if(a.length>100)error(`${where}: máximo de 100 vínculos.`);const arr=a.map((v,i)=>str(v,`${where}[${i}]`,160));if(new Set(arr.map(folded)).size!==arr.length)error(`${where}: vínculos repetidos.`);return arr}
  function validate(input){
    const obj=typeof input==='string'?JSON.parse(input):input;
    if(!plain(obj))error('O pacote deve ser um objeto JSON.');
    keysOnly(obj,'root','pacote');if(obj.schema!==schema)error(`Formato não reconhecido. Use "schema": "${schema}".`);
    const result={schema,packageId:key(obj.packageId,'packageId'),name:str(obj.name,'name',120)};
    let total=0;
    for(const type of ['foundations','focuses','exercises']){
      const vals=array(obj[type],type);total+=vals.length;if(vals.length>MAX)error(`${type}: máximo ${MAX} itens.`);
      const seen=new Set();
      result[type]=vals.map((item,i)=>{
        const w=`${type}[${i}]`;
        if(!plain(item))error(`${w}: formato inválido.`);
        keysOnly(item,type==='foundations'?'foundation':type==='focuses'?'focus':'exercise',w);
        const k=key(item.key,`${w}.key`);if(seen.has(k))error(`${w}: identificador ${k} repetido.`);seen.add(k);
        if(type==='foundations')return {
          key:k,name:str(item.name,`${w}.name`,160),master:str(item.master??'',`${w}.master`,160,false),
          courseUrl:url(item.courseUrl,`${w}.courseUrl`),complexity:integer(item.complexity,`${w}.complexity`,1,3,2),focusKeys:linkKeys(item.focusKeys,`${w}.focusKeys`)
        };
        if(type==='focuses')return {

function focusHistory(f){if(!Array.isArray(f.history))f.history=[];return f.history}
function focusInterval(f){return Number(f.intervalDays)||0}
function focusLastRating(f){const h=focusHistory(f);return h.length?h[h.length-1].rating:null}
function focusPriority(f,now=Date.now()){const h=focusHistory(f);if(!h.length)return 100000-(f.createdAt||0)/1e12;const due=Number(f.nextDue)||0;if(due>now)return -Infinity;const overdue=Math.max(0,(now-due)/86400000),last=focusLastRating(f)||3;return overdue*4+(6-last)*8+Math.min(12,h.length*.15)}
function selectDueFocus(){const now=Date.now(),list=state.focuses||[];if(!list.length)return null;const fresh=list.filter(f=>!focusHistory(f).length).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));if(fresh.length)return fresh[0];const due=list.filter(f=>(Number(f.nextDue)||0)<=now);if(!due.length)return null;return due.sort((a,b)=>focusPriority(b,now)-focusPriority(a,now))[0]}
function routedFocus(){if(route.id){const exact=(state.focuses||[]).find(f=>f.id===route.id);if(exact)return exact}return selectDueFocus()}
function nextFocusDue(){const reviewed=(state.focuses||[]).filter(f=>focusHistory(f).length&&Number(f.nextDue)>Date.now()).sort((a,b)=>a.nextDue-b.nextDue);return reviewed[0]||null}
function focusView(){const f=routedFocus();if(!(state.focuses||[]).length)return `<div class="focus-page-head">${pageHead('Focos','Hoje, presta atenção nisso')}<div class="toolbar"><button class="btn" onclick="nav('focusLibrary')">Biblioteca</button><button class="btn primary" onclick="nav('newFocus')">Adicionar foco</button></div></div><div class="focus-empty"><div class="inner"><h2>Crie o primeiro foco</h2><p>Guarde um princípio visual que merece voltar à sua cabeça durante o desenho. O sistema cuida de quando ele reaparece.</p><button class="btn primary" onclick="nav('newFocus')">Adicionar foco</button></div></div>`;
 if(!f){const next=nextFocusDue(),when=next?new Date(next.nextDue).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}):'';return `<div class="focus-page-head">${pageHead('Focos','Nada precisa voltar agora')}<div class="toolbar"><button class="btn" onclick="nav('focusLibrary')">Biblioteca</button></div></div><div class="focus-empty"><div class="inner"><h2>Por enquanto, é isso.</h2><p>${when?`O próximo princípio volta por volta de ${esc(when)}.`:'Quando algum princípio precisar ser reativado, ele aparece aqui.'}</p><button class="btn" onclick="nav('focusLibrary')">Ver biblioteca</button></div></div>`}
 return `<div class="focus-page-head"><div class="hero"><div class="eyebrow">Focos</div><h1>Hoje, presta atenção nisso</h1></div><div class="toolbar"><button class="btn" onclick="nav('focusLibrary')">Biblioteca</button></div></div><div class="focus-now"><button class="focus-visual" id="focusVisual_${f.id}" onclick="viewArt('${f.imageId}')" aria-label="Ampliar imagem"><span class="meta">Carregando imagem…</span></button><section class="focus-copy"><div><div class="eyebrow">Princípio</div><h2>${esc(f.title)}</h2><div class="focus-concept">${esc(f.concept)}</div><div class="focus-command"><div class="eyebrow">Leve para o desenho</div><strong>${esc(f.microSkill)}</strong></div></div><div class="focus-actions">${EA.safeUrl(f.courseUrl)?`<a class="focus-deeper" href="${esc(EA.safeUrl(f.courseUrl))}" target="_blank" rel="noopener">Rever conceito no Course Vault ↗</a>`:''}<div class="focus-feedback"><p>Depois de tentar usar isso, como foi?</p><div class="focus-rating"><button onclick="rateFocus('${f.id}',1)">Muito difícil</button><button onclick="rateFocus('${f.id}',2)">Difícil</button><button onclick="rateFocus('${f.id}',3)">OK</button><button onclick="rateFocus('${f.id}',4)">Fácil</button><button onclick="rateFocus('${f.id}',5)">Automático</button></div></div></div></section></div>`}

function newFocusView(){return `${pageHead('Focos','Novo foco','Um foco é um princípio que você quer manter vivo enquanto desenha.')}<div class="panel" style="max-width:760px"><div class="field"><label>Nome do princípio</label><input id="focusTitle" class="input" placeholder="Ex.: Cabeça como volume em perspectiva"></div><div class="field"><label>Imagem que ilustra o princípio</label><input id="focusImage" class="input" type="file" accept="image/*"></div><div class="field"><label>Conceito — o que é e por que importa</label><textarea id="focusConcept" class="textarea" rows="5"></textarea></div><div class="field"><label>Micro-habilidade — o que lembrar durante o desenho</label><textarea id="focusMicroSkill" class="textarea" rows="4" placeholder="Ex.: Antes do contorno, identifique o volume principal e sua inclinação."></textarea></div><div class="field"><label>Link de aula no Course Vault (opcional)</label><input id="focusCourse" class="input" type="url" placeholder="https://..."></div><button class="btn primary" onclick="createFocus()">Salvar foco</button></div>`}
async function createFocus(){const title=document.getElementById('focusTitle').value.trim(),concept=document.getElementById('focusConcept').value.trim(),microSkill=document.getElementById('focusMicroSkill').value.trim(),file=document.getElementById('focusImage').files[0],courseUrl=document.getElementById('focusCourse').value.trim();if(!title||!concept||!microSkill||!file)return alert('Preencha nome, imagem, conceito e micro-habilidade.');const imageId=await putImage(file,{kind:'focus'});state.focuses.push({id:id('focus'),title,concept,microSkill,courseUrl,imageId,history:[],intervalDays:0,nextDue:Date.now(),createdAt:Date.now()});save();nav('focus')}
function editFocusView(fid){const f=(state.focuses||[]).find(x=>x.id===fid);if(!f)return `<div class="empty">Foco não encontrado.</div>`;return `${pageHead('Focos','Editar foco')}<div class="panel" style="max-width:760px"><div id="focusEditPreview" class="focus-form-preview">Carregando imagem…</div><div class="field"><label>Nome do princípio</label><input id="focusTitle" class="input" value="${esc(f.title)}"></div><div class="field"><label>Trocar imagem (opcional)</label><input id="focusImage" class="input" type="file" accept="image/*"></div><div class="field"><label>Conceito</label><textarea id="focusConcept" class="textarea" rows="5">${esc(f.concept)}</textarea></div><div class="field"><label>Micro-habilidade</label><textarea id="focusMicroSkill" class="textarea" rows="4">${esc(f.microSkill)}</textarea></div><div class="field"><label>Link de aula no Course Vault (opcional)</label><input id="focusCourse" class="input" type="url" value="${esc(f.courseUrl||'')}"></div><div class="toolbar"><button class="btn primary" onclick="saveFocus('${fid}')">Salvar</button><button class="btn" onclick="deleteFocus('${fid}')">Excluir foco</button></div></div>`}

async function saveFocus(fid){const f=(state.focuses||[]).find(x=>x.id===fid);if(!f)return;const title=document.getElementById('focusTitle').value.trim(),concept=document.getElementById('focusConcept').value.trim(),microSkill=document.getElementById('focusMicroSkill').value.trim(),courseUrl=document.getElementById('focusCourse').value.trim(),file=document.getElementById('focusImage').files[0];if(!title||!concept||!microSkill)return alert('Preencha nome, conceito e micro-habilidade.');f.title=title;f.concept=concept;f.microSkill=microSkill;f.courseUrl=courseUrl;if(file){const old=f.imageId;f.imageId=await putImage(file,{kind:'focus'});if(old)await deleteImage(old)}save();nav('focusLibrary')}
async function deleteFocus(fid){if(!confirm('Excluir este foco?'))return;const f=(state.focuses||[]).find(x=>x.id===fid);state.focuses=(state.focuses||[]).filter(x=>x.id!==fid);save();if(f?.imageId)await deleteImage(f.imageId);nav('focusLibrary')}
function rateFocus(fid,rating){const f=(state.focuses||[]).find(x=>x.id===fid);if(!f)return;const h=focusHistory(f),prev=focusInterval(f);let days;if(rating===1)days=.5;else if(rating===2)days=prev?Math.max(1,Math.min(3,prev*.55)):2;else if(rating===3)days=prev?Math.max(4,prev*1.35):5;else if(rating===4)days=prev?Math.max(9,prev*1.8):10;else days=prev?Math.max(24,prev*2.25):24;h.push({rating,at:Date.now()});if(h.length>60)h.splice(0,h.length-60);f.intervalDays=days;f.nextDue=Date.now()+days*86400000;save();showToast('Registrado. O sistema ajustou quando esse foco volta.');route={page:'focus'};render()}

function foundationView(fid){const f=state.foundations.find(x=>x.id===fid);if(!f)return `<div class="empty">Fundamento não encontrado.</div>`;const notes=state.notes.filter(n=>n.foundationId===fid&&n.source==='practice');const favs=notes.filter(n=>n.favorite);return `<div class="image-page-head"><div class="hero"><div class="eyebrow">Fundamento</div><h1>${esc(f.name)}</h1>${f.master?`<p class="lead">${esc(f.master)}</p>`:''}</div><div class="toolbar"><button class="btn" onclick="nav('editFoundation',{id:'${fid}'})">Editar</button><button class="btn green" onclick="startPractice('${fid}')">Prática</button></div></div>

const DB='a'+'telie-local-images-v3',TABLE='images';
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(TABLE))r.result.createObjectStore(TABLE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function putImage(file,meta={}){const db=await openDb(),imageId=id('img');await new Promise((resolve,reject)=>{const tx=db.transaction(TABLE,'readwrite');tx.objectStore(TABLE).put({id:imageId,name:file.name,blob:file,...meta,createdAt:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});return imageId}
async function setImageHash(imageId,hash){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(TABLE,'readwrite'),store=tx.objectStore(TABLE),r=store.get(imageId);r.onsuccess=()=>{if(r.result){r.result.hash=hash;store.put(r.result)}};r.onerror=()=>reject(r.error);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function getImage(imageId){const db=await openDb();return new Promise((resolve,reject)=>{const r=db.transaction(TABLE,'readonly').objectStore(TABLE).get(imageId);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function deleteImage(imageId){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(TABLE,'readwrite');tx.objectStore(TABLE).delete(imageId);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function addMasterImages(e,fid){const files=[...e.target.files];if(!files.length)return;const f=state.foundations.find(x=>x.id===fid);for(const file of files)f.artIds.push(await putImage(file,{kind:'master',foundationId:fid}));save();loadArtGrid(fid)}
async function loadArtGrid(fid){const el=document.getElementById('artGrid');if(!el)return;const f=state.foundations.find(x=>x.id===fid);if(!f.artIds.length){el.innerHTML='<div class="empty" style="grid-column:1/-1">Nenhuma obra adicionada.</div>';return}const parts=[];for(const imageId of f.artIds){const img=await getImage(imageId);if(!img)continue;const url=URL.createObjectURL(img.blob);parts.push(`<div class="art"><button class="art-main" onclick="viewArt('${imageId}')"><img src="${url}" alt="${esc(img.name)}"></button><button class="x" onclick="event.stopPropagation();removeArt('${fid}','${imageId}')">×</button><div class="art-cap">${esc(img.name)}</div></div>`)}el.innerHTML=parts.join('')||'<div class="empty" style="grid-column:1/-1">Nenhuma obra adicionada.</div>'}
async function removeArt(fid,imageId){if(!confirm('Remover esta obra?'))return;const f=state.foundations.find(x=>x.id===fid);f.artIds=f.artIds.filter(x=>x!==imageId);save();await deleteImage(imageId);loadArtGrid(fid)}
async function viewArt(imageId){const img=await getImage(imageId);if(!img)return;document.getElementById('dialogImg').src=URL.createObjectURL(img.blob);document.getElementById('artDialog').showModal()}

async function practiceStep(){if(practice.step===1)return `<div style="max-width:720px;margin:6vh auto 0"><h2>O que você vai tentar replicar?</h2><p class="lead" style="margin:8px 0 18px">Escreva o que você percebeu antes de começar.</p><div class="field"><textarea id="practiceIntention" class="textarea" rows="7"></textarea></div><button class="btn green" onclick="practiceIntentionNext()">Continuar</button></div>`;
 const img=await getImage(practice.imageId),url=URL.createObjectURL(img.blob);
 if(practice.step===2)return `<div class="practice-grid"><div class="practice-visual"><img src="${url}" alt="Referência"></div><div class="practice-side"><div><h2>Com referência</h2><p class="meta" style="margin:8px 0 0">${esc(practice.intention)}</p></div><div class="upload"><input id="practiceRefFile" type="file" accept="image/*" onchange="practiceUploadRef()">${practice.refStudyId?await previewHtml(practice.refStudyId):'<div class="meta" style="margin-top:10px">Seu estudo aparecerá aqui.</div>'}</div><button class="btn green" ${practice.refStudyId?'':'disabled'} onclick="practice.step=3;renderPractice()">Continuar sem referência</button></div></div>`;
 if(practice.step===3)return `<div class="practice-grid"><div class="no-reference"><div><strong>Referência escondida</strong><div class="meta" style="margin-top:6px">Faça a nova versão sem olhar a obra.</div></div></div><div class="practice-side"><div><h2>Sem referência</h2></div><div class="upload"><input id="practiceNoRefFile" type="file" accept="image/*" onchange="practiceUploadNoRef()">${practice.noRefStudyId?await previewHtml(practice.noRefStudyId):'<div class="meta" style="margin-top:10px">Sua versão de memória aparecerá aqui.</div>'}</div><button class="btn green" ${practice.noRefStudyId?'':'disabled'} onclick="practice.step=4;renderPractice()">Comparar</button></div></div>`;
 const noRef=await getImage(practice.noRefStudyId),noRefUrl=noRef?URL.createObjectURL(noRef.blob):'';
 return `<div class="compare-wall"><div class="visual-wrap"><span class="compare-label">Referência</span><div class="practice-visual"><img src="${url}" alt="Referência"></div></div><div class="visual-wrap"><span class="compare-label">Seu estudo sem referência</span><div class="practice-visual">${noRefUrl?`<img src="${noRefUrl}" alt="Estudo sem referência">`:''}</div></div></div><div style="max-width:900px;margin:0 auto"><h2>O que ficou diferente?</h2><p class="meta" style="margin:7px 0 12px">Compare olhando as duas imagens.</p><div class="field"><textarea id="practiceCompare" class="textarea" rows="5"></textarea></div><button class="btn green" onclick="finishPractice()">Salvar prática</button></div>`}

let focusDraftFiles=[];

function ensureTrainingLog(){if(!Array.isArray(state.trainingLog))state.trainingLog=[];return state.trainingLog}
function todayKey(ts=Date.now()){const d=new Date(ts);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function guidedDoneToday(){const key=todayKey();return ensureTrainingLog().filter(x=>todayKey(x.at)===key).length}
function focusImageIds(f){if(!f)return[];if(!Array.isArray(f.imageIds))f.imageIds=f.imageId?[f.imageId]:[];if(f.imageIds.length&&!f.imageId)f.imageId=f.imageIds[0];return f.imageIds}

function focusNeedScore(f){const h=focusHistory(f);if(!h.length)return 92;const last=h[h.length-1].rating||3;const base={1:100,2:82,3:56,4:28,5:10}[last]||50;const due=Number(f.nextDue)||0;const overdue=due&&Date.now()>due?Math.min(30,(Date.now()-due)/86400000*5):0;return base+overdue}
function desiredDifficultyForFocus(f){const h=focusHistory(f);const r=h.length?h[h.length-1].rating:2;if(r<=2)return'easy';if(r===3)return'medium';return'hard'}
function recommendationForExercise(kind,ex){const linked=exerciseFocusIds(ex).map(id=>(state.focuses||[]).find(f=>f.id===id)).filter(Boolean);let score=0,reason='Mantém o treino andando';if(linked.length){const ranked=linked.map(f=>({f,need:focusNeedScore(f)})).sort((a,b)=>b.need-a.need);const top=ranked[0];score+=top.need*1.25;reason=`Ponto em foco: ${top.f.title}`;if(ex.difficulty===desiredDifficultyForFocus(top.f))score+=18}else{score+=18;reason='Exercício disponível para manter consistência'}const c=exCounts(ex);if(!c.done)score+=22;const age=ex.lastGuidedAt?Math.min(25,(Date.now()-ex.lastGuidedAt)/86400000*3):25;score+=age;const sessionSeen=new Set(guidedSession?.seen||[]);if(sessionSeen.has(ex.id))score-=80;return{kind,ex,score,reason,focus:linked.sort((a,b)=>focusNeedScore(b)-focusNeedScore(a))[0]||null}}
function chooseRecommendedExercise(){const pool=allExercises();if(!pool.length)return null;let ranked=pool.map(({kind,ex})=>recommendationForExercise(kind,ex)).sort((a,b)=>b.score-a.score);if(guidedSession?.seen?.length&&ranked.every(r=>(guidedSession.seen||[]).includes(r.ex.id)))guidedSession.seen=[];ranked=pool.map(({kind,ex})=>recommendationForExercise(kind,ex)).sort((a,b)=>b.score-a.score);return ranked[0]||null}
function startGuidedTraining(extra=false){if(!allExercises().length)return alert('Adicione pelo menos um exercício antes de iniciar o treino automático.');guidedSession={active:true,extra:!!extra,seen:[],current:null,reason:''};persistGuided();openNextGuidedExercise()}
function openNextGuidedExercise(){if(!guidedSession?.active)return;const rec=chooseRecommendedExercise();if(!rec)return alert('Não encontrei exercícios para recomendar.');guidedSession.current={kind:rec.kind,id:rec.ex.id};guidedSession.reason=rec.reason;guidedSession.seen=[...(guidedSession.seen||[]),rec.ex.id];persistGuided();route={page:'exercise',kind:rec.kind,id:rec.ex.id};render();setTimeout(()=>document.querySelector('.exercise-workspace')?.scrollIntoView({behavior:'smooth',block:'start'}),120)}
function completeGuidedExercise(){if(!guidedSession?.current)return;const {kind,id:exid}=guidedSession.current;const ex=state.exercises[kind].find(x=>x.id===exid);if(ex)ex.lastGuidedAt=Date.now();ensureTrainingLog().push({at:Date.now(),kind,exerciseId:exid});if(state.trainingLog.length>240)state.trainingLog.splice(0,state.trainingLog.length-240);save();const count=guidedDoneToday();if(!guidedSession.extra&&count>=3){guidedSession=null;persistGuided();route={page:'home'};render();window.scrollTo({top:0,behavior:'smooth'});return}openNextGuidedExercise()}

const EA={
  ratings:['','Muito difícil','Difícil','Médio','Fácil','Muito fácil'],
  clamp:(v,lo,hi)=>Math.max(lo,Math.min(hi,v)),
  focusById:id=>(state.focuses||[]).find(x=>x.id===id),
  foundationById:id=>(state.foundations||[]).find(x=>x.id===id),
  complexity:f=>EA.clamp(Number(f?.complexity)||2,1,3),

  date:()=>todayKey(),

  didToday:()=>!!(state.dailyCompletions||[]).find(x=>x.day===EA.date()),
  linked:ex=>exerciseFocusIds(ex).map(EA.focusById).filter(Boolean),

  intensityLabels:{light:'Leve',normal:'Moderado',hard:'Intenso'},
  intensityOffset:{light:-.55,normal:0,hard:.55},

EA.focusStrength=function(f){
 const h=focusHistory(f).slice(-5);if(!h.length)return null;
 let sum=0,total=0;h.forEach((x,i)=>{const weight=i+1;sum+=(Number(x.rating)||3)*weight;total+=weight});return sum/total;
};
EA.focusNeed=function(f){
 const strength=EA.focusStrength(f);if(strength===null)return 48; // desconhecido ≠ deficiente
 const due=(Number(f.nextDue)||0),over=due&&Date.now()>due?Math.min(12,(Date.now()-due)/86400000*2):0;
 return (6-strength)*18+over;
};
EA.focusWindow=function(){
 const now=Date.now(); const eligible=(state.focuses||[]).filter(f=>Number(f.deferUntil||0)<=now && (!focusHistory(f).length || Number(f.nextDue||0)<=now));
 return eligible.sort((a,b)=>{
  // revisões vencidas e introdução de novos princípios são intercaladas
  const aa=focusHistory(a).length?EA.focusNeed(a)+20:68;
  const bb=focusHistory(b).length?EA.focusNeed(b)+20:68;
  return bb-aa||(a.createdAt||0)-(b.createdAt||0);
 }).slice(0,3)
};
EA.mainFocus=function(){return EA.focusWindow()[0]||null};
EA.deferFocus=function(id){const f=EA.focusById(id);if(!f)return;f.deferUntil=Date.now()+12*3600000;save();render()};
EA.focusInterval=function(f,rating){
 const prev=Number(f.intervalDays)||0;
 const base={1:.5,2:2,3:5,4:10,5:24}[rating];
 if(!prev)return base;
 const h=focusHistory(f);const last=h.slice(-3);const sm=last.reduce((s,x,i)=>s+Number(x.rating)*(i+1),0)/last.reduce((s,_,i)=>s+i+1,0);
 if(rating<=2)return Math.max(.5,Math.min(base,prev*.75));
 if(rating===3)return Math.max(3,Math.min(9,prev*1.4));
 return Math.min(120,Math.max(2,prev*(sm>=4?2:1.55)));
};

 const f=EA.focusById(fid);if(!f||rating<1||rating>5)return;

 focusHistory(f).push({rating,at:now,source:'manual-focus'});
 if(f.history.length>100)f.history.splice(0,f.history.length-100);
 f.intervalDays=days;f.nextDue=now+days*86400000;f.deferUntil=0;
 save();showToast('Foco avaliado. Você pode continuar desenhando.');route={page:'focus'};render();
};

EA.levelValue=d=>({easy:1,medium:2,hard:3})[d]||1;

 const history=EA.history(ex);let target=.95;
 if(history.length){const avg=EA.ratingMean(ex);target=EA.challenge(ex)+(avg-3)*.42}

};
EA.defaultIntensity=function(){
 const completed=(state.dailyCompletions||[]);const seq=['normal','light','hard','light','normal'];
 let selection=seq[completed.length%seq.length];
 const r=(state.exerciseSessions||[]).slice(-5).filter(x=>x.rating!=null);
 if(r.length>=3&&r.reduce((s,x)=>s+x.rating,0)/r.length<=2)selection='light';
 return selection;
};

EA.recommendation=function(kind,ex,intensity='normal',used=new Set(),chosenFoci=new Map()){
 const linked=EA.linked(ex);if(!EA.foundationById(ex.foundationId)||!linked.length)return null;
 const priorities=linked.map(f=>EA.focusNeed(f));
 const best=Math.max(...priorities);
 const untested=EA.history(ex).length===0;
 const focusStrength=EA.focusStrength(linked.slice().sort((a,b)=>EA.focusNeed(b)-EA.focusNeed(a))[0]);
 const focusAdjust=focusStrength===null?0:EA.clamp((focusStrength-3)*.15,-.3,.3);
 const target=EA.target(ex,intensity)+focusAdjust,gap=Math.abs(EA.challenge(ex)-target);
 const last=EA.history(ex).at(-1)?.at||ex.lastGuidedAt||0;
 const elapsed=last?(Date.now()-last)/86400000:120;
 const freshness=EA.clamp(elapsed*1.4,0,22);
 const distinct=linked.some(f=>!chosenFoci.has(f.id));
 const repetition=linked.reduce((s,f)=>s+(chosenFoci.get(f.id)||0),0);
 let score=best*1.35-gap*26+freshness+(untested?12:0)+(distinct?13:0)-repetition*16;
 if(used.has(ex.id))score-=210;
 const focus=linked.slice().sort((a,b)=>EA.focusNeed(b)-EA.focusNeed(a))[0];
 return {kind,ex,focus,score,reason:`${focus.title} · ${['','básico','intermediário','complexo'][EA.complexity(EA.foundationById(ex.foundationId))]} · nível ${difficultyLabel(ex.difficulty)}`};
};
EA.buildPlan=function(intensity='normal',amount=3){
 const pool=EA.validExercises();if(!pool.length)return [];
 const plan=[],used=new Set(),chosenFoci=new Map();
 for(let i=0;i<Math.min(amount,pool.length);i++){
  const ranked=pool.map(({kind,ex})=>EA.recommendation(kind,ex,intensity,used,chosenFoci)).filter(Boolean).sort((a,b)=>b.score-a.score);
  const best=ranked[0];if(!best)break;
  plan.push({kind:best.kind,id:best.ex.id,reason:best.reason,focusId:best.focus?.id||null});
  used.add(best.ex.id);
  for(const f of EA.linked(best.ex))chosenFoci.set(f.id,(chosenFoci.get(f.id)||0)+1);
 }
 return plan;
};

// Calibração por Foco + fundamento: dados dos exercícios equivalentes informam o desafio ideal.
// A complexidade do fundamento nunca desaparece inteiramente da comparação.
EA.validExercises=function(){
 const foundations=new Set((state.foundations||[]).map(f=>f.id));
 const focuses=new Set((state.focuses||[]).map(f=>f.id));
 return allExercises().filter(({ex})=>foundations.has(ex.foundationId)&&exerciseFocusIds(ex).some(id=>focuses.has(id)));
};
EA.recommendationContext=function(){
 const groups=new Map(), all=EA.validExercises();let count=0;
 const focusMap=new Map((state.focuses||[]).map(f=>[f.id,f]));
 const foundationMap=new Map((state.foundations||[]).map(f=>[f.id,f]));
 for(const {ex} of all){
  const f=foundationMap.get(ex.foundationId),levelBias=(EA.complexity(f)-2)*.45;
  count+=EA.history(ex).length;
  for(const focus of exerciseFocusIds(ex).map(id=>focusMap.get(id)).filter(Boolean)){
   const key=ex.foundationId+'|'+focus.id;
   if(!groups.has(key))groups.set(key,[]);
   const bucket=groups.get(key);
   for(const item of EA.history(ex).slice(-8)){
    const rating=Number(item.rating);
    if(!(rating>=1&&rating<=5))continue;
    const challenge=EA.levelValue(item.difficulty||ex.difficulty)+levelBias;
    bucket.push({at:Number(item.at)||0,challenge,rating});
   }
  }
 }
 for(const [key,samples] of groups)groups.set(key,samples.sort((a,b)=>b.at-a.at).slice(0,24));
 const sessions=(state.exerciseSessions||[]).length;
 return {groups,focusMap,foundationMap,round:Math.floor(Math.max(count,sessions)/3)};
};
EA.idealChallenge=function(ex,focus,intensity,ctx){
 const base=1.65;
 const samples=ctx.groups.get(ex.foundationId+'|'+focus.id)||[];
 let target=base;
 if(samples.length){
  let sum=0,weight=0;
  samples.forEach((s,i)=>{const w=1/(1+i*.18);sum+=(s.challenge+(s.rating-3)*.44)*w;weight+=w});
  const learned=sum/weight;
  // Mesmo quando há histórico, reserva-se alguma influência ao desafio absoluto.
  target=.83*learned+.17*base;
 }
 const focusStrength=EA.focusStrength(focus);
 const attentionAdjust=focusStrength===null?0:EA.clamp((focusStrength-3)*.06,-.12,.12);
 return EA.clamp(target+attentionAdjust+(EA.intensityOffset[intensity]||0),.65,3.5);
};
EA.recommendation=function(kind,ex,intensity='normal',used=new Set(),chosenFoci=new Map(),ctx=null){
 ctx=ctx||EA.recommendationContext();
 const foundation=ctx.foundationMap.get(ex.foundationId);
 const linked=exerciseFocusIds(ex).map(id=>ctx.focusMap.get(id)).filter(Boolean);
 if(!foundation||!linked.length)return null;
 const challenge=EA.levelValue(ex.difficulty)+(EA.complexity(foundation)-2)*.45;
 const focusOptions=linked.map(f=>({f,need:EA.focusNeed(f),target:EA.idealChallenge(ex,f,intensity,ctx)}));
 focusOptions.sort((a,b)=>b.need-a.need);
 const lead=focusOptions[0];
 const gap=Math.abs(challenge-lead.target);
 const last=EA.history(ex).at(-1)?.at||ex.lastGuidedAt||0;
 const elapsed=last?Math.max(0,(Date.now()-last)/86400000):120;
 const freshness=EA.clamp(elapsed*.65,0,13);
 const untested=EA.history(ex).length===0;
 const distinct=linked.some(f=>!chosenFoci.has(f.id));
 const repetition=linked.reduce((n,f)=>n+(chosenFoci.get(f.id)||0),0);
 const score=lead.need*1.25-gap*45+freshness+(untested?3:0)+(distinct?9:0)-repetition*13-(used.has(ex.id)?150:0);
 return {kind,ex,focus:lead.f,score,gap,target:lead.target,
  maintenance:EA.focusStrength(lead.f)!==null&&EA.focusStrength(lead.f)>=4,
  linked,reason:`${lead.f.title} · ${['','básico','intermediário','complexo'][EA.complexity(foundation)]} · nível ${difficultyLabel(ex.difficulty)}`};
};
EA.buildPlan=function(intensity='normal',amount=3,options={}){
 const pool=EA.validExercises(),plan=[],used=new Set(),chosenFoci=new Map();
 if(!pool.length)return plan;
 const ctx=EA.recommendationContext();
 const base=pool.map(({kind,ex})=>EA.recommendation(kind,ex,intensity,new Set(),new Map(),ctx)).filter(Boolean);
 const required=Math.max(1,Math.floor(amount));
 const maintenanceWindow=ctx.round>0&&ctx.round%4===3;
 for(let i=0;i<required;i++){
  if(used.size>=base.length)used.clear();
  const preferredMaintenance=maintenanceWindow&&i===required-1&&base.some(r=>r.maintenance&&!used.has(r.ex.id));
  let best=null,bestScore=-Infinity;
  for(const r of base){
   if(preferredMaintenance&&(!r.maintenance||used.has(r.ex.id)))continue;
   const linked=r.linked;
   const repetition=linked.reduce((n,f)=>n+(chosenFoci.get(f.id)||0),0);
   const lostDistinct=linked.every(f=>chosenFoci.has(f.id))?9:0;
   const score=r.score-(used.has(r.ex.id)?150:0)-repetition*13-lostDistinct;
   // Em manutenção, selecionar a prática menos recente em vez de só perseguir pontuação.
   const last=EA.history(r.ex).at(-1)?.at||0;
   const ranked=preferredMaintenance? -Math.min(Date.now(),last)/1e10+score*.001:score;
   if(ranked>bestScore){bestScore=ranked;best=r}
  }
  if(!best)break;
  plan.push({kind:best.kind,id:best.ex.id,reason:best.reason,focusId:best.focus?.id||null});
  used.add(best.ex.id);
  for(const f of best.linked)chosenFoci.set(f.id,(chosenFoci.get(f.id)||0)+1);
 }
 const master=EA.masterSuggestion();
 if(master&&plan.length>=3&&options.includeMaster!==false&&(options.includeMaster===true||
   (intensity==='light'&&ctx.round%3===2))){
  plan[2]={kind:'master',id:master.id,reason:'Aprofundamento opcional · '+master.name,
   fallback:plan[2]};
 }
 return plan;
};

EA.masterSuggestion=function(){
 const eligible=(state.foundations||[]).filter(f=>f.master||(f.artIds||[]).length);
 if(!eligible.length)return null;
 const pool=EA.validExercises();
 const ranked=eligible.map(f=>{
  const linked=new Set(f.focusIds||[]);
  for(const {ex} of pool)if(ex.foundationId===f.id)for(const fid of exerciseFocusIds(ex))linked.add(fid);
  const needs=[...linked].map(id=>EA.focusById(id)).filter(Boolean).map(x=>EA.focusNeed(x));
  return {f,score:needs.length?Math.max(...needs)+Math.min(20,needs.length*2):0};
 }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
 return ranked[0]?.f||null;
};

/* Sessões guiadas são contabilizadas por atividades realmente registradas.
   Se faltar exercício, substituir por outro; não transformar ausência em conclusão. */
EA.ensureGuided=function(){
 if(!guidedSession?.active)return null;
 if(!guidedSession.sessionId){guidedSession.sessionId=id('guide');guidedSession.startedAt=Date.now()}
 if(!Number.isInteger(guidedSession.completedCount))guidedSession.completedCount=0;
 if(!Array.isArray(guidedSession.plan))guidedSession.plan=[];
 return guidedSession;
};
EA.replaceMissingItem=function(){
 const s=EA.ensureGuided();if(!s)return null;
 const current=s.plan[s.currentIndex];
 if(current?.kind==='master'&&EA.foundationById(current.id))return current;
 if(current?.kind!=='master'&&state.exercises[current?.kind]?.some(x=>x.id===current.id))return current;
 const replacement=EA.buildPlan(s.intensity,3,{includeMaster:false});
 const earlier=new Set(s.plan.slice(0,s.currentIndex).filter(x=>x.kind!=='master').map(x=>x.kind+'|'+x.id));
 const next=replacement.find(x=>!earlier.has(x.kind+'|'+x.id))||replacement[0];
 if(!next)return null;
 s.plan[s.currentIndex]=next;persistGuided();return next;
};

};
EA.swapMasterForExercise=function(){
 const s=EA.ensureGuided(),item=s?.plan[s.currentIndex];if(item?.kind!=='master')return;
 const fallback=item.fallback;
 const alternative=fallback&&state.exercises[fallback.kind]?.some(x=>x.id===fallback.id)?fallback:
  EA.buildPlan(s.intensity,3,{includeMaster:false})[0];
 if(!alternative){route={page:'eaSetup'};render();return}
 s.plan[s.currentIndex]=alternative;persistGuided();openNextGuidedExercise();
};
EA.completeMasterStep=function(){
 const s=EA.ensureGuided(),item=s?.plan[s.currentIndex];if(item?.kind!=='master'||!EA.foundationById(item.id))return;
 if(!Array.isArray(state.guidedStudies))state.guidedStudies=[];
 state.guidedStudies.push({at:Date.now(),foundationId:item.id,sessionId:s.sessionId,via:'guided'});
 s.completedCount++;s.currentIndex++;s.current=null;
 save();persistGuided();openNextGuidedExercise();
};

};
openNextGuidedExercise=function(){
 const s=EA.ensureGuided();if(!s)return;
 if(s.currentIndex>=s.plan.length){EA.completeDay();return}
 const item=EA.replaceMissingItem();
 if(!item){s.current=null;persistGuided();route={page:'eaSetup'};render();return}
 if(item.kind==='master'){
  s.current={kind:'master',id:item.id};s.reason=item.reason;persistGuided();
  route={page:'eaMaster',id:item.id};render();return;
 }
 s.current={kind:item.kind,id:item.id};s.reason=item.reason;
 persistGuided();route={page:'exercise',kind:item.kind,id:item.id};render();
 setTimeout(()=>document.querySelector('.exercise-header')?.scrollIntoView({behavior:'smooth',block:'start'}),100);
};
EA.advanceGuided=function(){
 const s=EA.ensureGuided();if(!s||!s.current||s.current.kind==='master')return;
 const log=state.exerciseSessions?.at(-1);
 if(!log||log.via!=='guided'||log.exerciseId!==s.current.id||log.kind!==s.current.kind||log.at<s.startedAt)return;
 // Associar explicitamente o log à sessão para não confundir atividades de dias diferentes.
 log.sessionId=s.sessionId;s.completedCount++;
 s.currentIndex++;s.current=null;
 save();persistGuided();openNextGuidedExercise();
};
EA.completeDay=function(){
 const s=EA.ensureGuided();if(!s)return;
 const completed=s.completedCount;
 const guidedLogs=(state.exerciseSessions||[]).filter(x=>x.sessionId===s.sessionId&&x.via==='guided').length;
 const studies=(state.guidedStudies||[]).filter(x=>x.sessionId===s.sessionId).length;
 const verified=completed===guidedLogs+studies&&completed>=3;
 if(!verified){
  if(EA.validExercises().length){
   const replacement=EA.buildPlan(s.intensity,3,{includeMaster:false})[0];
   if(replacement){s.plan.push(replacement);persistGuided();openNextGuidedExercise();return}
  }
  persistGuided();route={page:'eaSetup'};render();return;
 }
 if(!s.extra&&!EA.didToday()){
  state.dailyCompletions.push({day:EA.date(),at:Date.now(),completed,exerciseCount:guidedLogs,
   studyCount:studies,intensity:s.intensity,sessionId:s.sessionId});save();
 }
 guidedSession=null;persistGuided();route={page:'eaDone',extra:!!s.extra,finished:completed,intensity:s.intensity};render();
 window.scrollTo({top:0,behavior:'smooth'});
};
