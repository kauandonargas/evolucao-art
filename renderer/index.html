const DB='a'+'telie-local-images-v3',TABLE='images';
function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(TABLE))r.result.createObjectStore(TABLE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function putImage(file,meta={}){const db=await openDb(),imageId=id('img');await new Promise((resolve,reject)=>{const tx=db.transaction(TABLE,'readwrite');tx.objectStore(TABLE).put({id:imageId,name:file.name,blob:file,...meta,createdAt:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});return imageId}
async function setImageHash(imageId,hash){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(TABLE,'readwrite'),store=tx.objectStore(TABLE),r=store.get(imageId);r.onsuccess=()=>{if(r.result){r.result.hash=hash;store.put(r.result)}};r.onerror=()=>reject(r.error);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function getImage(imageId){const db=await openDb();return new Promise((resolve,reject)=>{const r=db.transaction(TABLE,'readonly').objectStore(TABLE).get(imageId);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function deleteImage(imageId){const db=await openDb();return new Promise((resolve,reject)=>{const tx=db.transaction(TABLE,'readwrite');tx.objectStore(TABLE).delete(imageId);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function addMasterImages(e,fid){const files=[...e.target.files];if(!files.length)return;const f=state.foundations.find(x=>x.id===fid);for(const file of files)f.artIds.push(await putImage(file,{kind:'master',foundationId:fid}));save();loadArtGrid(fid)}
async function loadArtGrid(fid){const el=document.getElementById('artGrid');if(!el)return;const f=state.foundations.find(x=>x.id===fid);if(!f.artIds.length){el.innerHTML='<div class="empty" style="grid-column:1/-1">Nenhuma obra adicionada.</div>';return}const parts=[];for(const imageId of f.artIds){const img=await getImage(imageId);if(!img)continue;const url=URL.createObjectURL(img.blob);parts.push(`<div class="art"><button class="art-main" onclick="viewArt('${imageId}')"><img src="${url}" alt="${esc(img.name)}"></button><button class="x" onclick="event.stopPropagation();removeArt('${fid}','${imageId}')">×</button><div class="art-cap">${esc(img.name)}</div></div>`)}el.innerHTML=parts.join('')||'<div class="empty" style="grid-column:1/-1">Nenhuma obra adicionada.</div>'}
async function removeArt(fid,imageId){if(!confirm('Remover esta obra?'))return;const f=state.foundations.find(x=>x.id===fid);f.artIds=f.artIds.filter(x=>x!==imageId);save();await deleteImage(imageId);loadArtGrid(fid)}
async function viewArt(imageId){const img=await getImage(imageId);if(!img)return;document.getElementById('dialogImg').src=URL.createObjectURL(img.blob);document.getElementById('artDialog').showModal()}

async function startPractice(fid){const f=state.foundations.find(x=>x.id===fid);if(!f.artIds.length)return alert('Adicione pelo menos uma obra do mestre antes de iniciar a prática.');practice={fid,imageId:f.artIds[Math.floor(Math.random()*f.artIds.length)],step:1,intention:'',refStudyId:null,noRefStudyId:null};practice.artist=f.artists?.[practice.imageId]||f.master||'';renderPractice()}
async function renderPractice(){const overlay=document.getElementById('overlay'),f=state.foundations.find(x=>x.id===practice.fid);overlay.classList.add('open');overlay.innerHTML=`<div class="modal"><div class="modal-head"><div><strong>${esc(f.name)}</strong><div class="meta">${esc(practice?.artist||f.master||'')}</div></div><button class="modal-close" onclick="closePractice()">Fechar</button></div><div class="modal-body"><div class="steps">${['Anotação','Com referência','Sem referência','Comparação'].map((s,i)=>`<span class="step ${practice.step===i+1?'active':practice.step>i+1?'done':''}">${i+1}. ${s}</span>`).join('')}</div>${await practiceStep()}</div></div>`}
async function practiceStep(){if(practice.step===1)return `<div style="max-width:720px;margin:6vh auto 0"><h2>O que você vai tentar replicar?</h2><p class="lead" style="margin:8px 0 18px">Escreva o que você percebeu antes de começar.</p><div class="field"><label for="practiceArtist">Artista desta obra</label><input id="practiceArtist" class="ea-v19-artist-input" value="${esc(practice.artist||'')}" placeholder="Nome do artista"></div><div class="field"><textarea id="practiceIntention" class="textarea" rows="7"></textarea></div><button class="btn green" onclick="practiceIntentionNext()">Continuar</button></div>`;
 const img=await getImage(practice.imageId),url=URL.createObjectURL(img.blob);
 if(practice.step===2)return `<div class="practice-grid"><div class="practice-visual"><img src="${url}" alt="Referência"></div><div class="practice-side"><div><h2>Com referência</h2><p class="meta" style="margin:8px 0 0">${esc(practice.intention)}</p></div><div class="upload"><input id="practiceRefFile" type="file" accept="image/*" onchange="practiceUploadRef()">${practice.refStudyId?await previewHtml(practice.refStudyId):'<div class="meta" style="margin-top:10px">Seu estudo aparecerá aqui.</div>'}</div><button class="btn green" ${practice.refStudyId?'':'disabled'} onclick="practice.step=3;renderPractice()">Continuar sem referência</button></div></div>`;
 if(practice.step===3)return `<div class="practice-grid"><div class="no-reference"><div><strong>Referência escondida</strong><div class="meta" style="margin-top:6px">Faça a nova versão sem olhar a obra.</div></div></div><div class="practice-side"><div><h2>Sem referência</h2></div><div class="upload"><input id="practiceNoRefFile" type="file" accept="image/*" onchange="practiceUploadNoRef()">${practice.noRefStudyId?await previewHtml(practice.noRefStudyId):'<div class="meta" style="margin-top:10px">Sua versão de memória aparecerá aqui.</div>'}</div><button class="btn green" ${practice.noRefStudyId?'':'disabled'} onclick="practice.step=4;renderPractice()">Comparar</button></div></div>`;
 const noRef=await getImage(practice.noRefStudyId),noRefUrl=noRef?URL.createObjectURL(noRef.blob):'';
 return `<div class="compare-wall"><div class="visual-wrap"><span class="compare-label">Referência</span><div class="practice-visual"><img src="${url}" alt="Referência"></div></div><div class="visual-wrap"><span class="compare-label">Seu estudo sem referência</span><div class="practice-visual">${noRefUrl?`<img src="${noRefUrl}" alt="Estudo sem referência">`:''}</div></div></div><div style="max-width:900px;margin:0 auto"><h2>O que ficou diferente?</h2><p class="meta" style="margin:7px 0 12px">Compare olhando as duas imagens.</p><div class="field"><textarea id="practiceCompare" class="textarea" rows="5"></textarea></div><button class="btn green" onclick="finishPractice()">Salvar prática</button></div>`}
async function previewHtml(imageId){const img=await getImage(imageId);if(!img)return'';return `<img class="preview" src="${URL.createObjectURL(img.blob)}" alt="Estudo enviado">`}
function practiceIntentionNext(){const t=document.getElementById('practiceIntention').value.trim();if(!t)return alert('Escreva a anotação antes de continuar.');practice.intention=t;practice.artist=document.getElementById('practiceArtist')?.value.trim()||'';practice.step=2;renderPractice()}
async function practiceUploadRef(){const file=document.getElementById('practiceRefFile').files[0];if(!file)return;practice.refStudyId=await putImage(file,{kind:'practice-ref',foundationId:practice.fid});renderPractice()}
async function practiceUploadNoRef(){const file=document.getElementById('practiceNoRefFile').files[0];if(!file)return;practice.noRefStudyId=await putImage(file,{kind:'practice-noref',foundationId:practice.fid});renderPractice()}
function closePractice(){document.getElementById('overlay').classList.remove('open');document.getElementById('overlay').innerHTML='';practice=null}
function finishPractice(){const t=document.getElementById('practiceCompare').value.trim();if(!t)return alert('Escreva a comparação antes de salvar.');const pid=id('practice'),now=Date.now();const masterFoundation=state.foundations.find(f=>f.id===practice.fid);if(masterFoundation&&practice.artist){masterFoundation.artists={...(masterFoundation.artists||{}),[practice.imageId]:practice.artist};}state.practices.push({id:pid,foundationId:practice.fid,artist:practice.artist||'',imageId:practice.imageId,refStudyId:practice.refStudyId,noRefStudyId:practice.noRefStudyId,intention:practice.intention,comparison:t,createdAt:now});state.notes.push({id:id('note'),foundationId:practice.fid,artist:practice.artist||'',text:practice.intention,source:'practice',kind:'intention',label:'Antes do estudo',favorite:false,practiceId:pid,createdAt:now});state.notes.push({id:id('note'),foundationId:practice.fid,artist:practice.artist||'',text:t,source:'practice',kind:'comparison',label:'Depois do estudo',favorite:false,practiceId:pid,createdAt:now+1});save();const fid=practice.fid;closePractice();route={page:'foundation',id:fid};render()}


/* V2 — guided training + multiple focus images */
let focusDraftFiles=[];
let guidedSession=(()=>{try{return JSON.parse(sessionStorage.getItem('art-guided-session-v1')||'null')}catch{return null}})();
function persistGuided(){if(guidedSession)sessionStorage.setItem('art-guided-session-v1',JSON.stringify(guidedSession));else sessionStorage.removeItem('art-guided-session-v1')}
function ensureTrainingLog(){if(!Array.isArray(state.trainingLog))state.trainingLog=[];return state.trainingLog}
function todayKey(ts=Date.now()){const d=new Date(ts);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function guidedDoneToday(){const key=todayKey();return ensureTrainingLog().filter(x=>todayKey(x.at)===key).length}
function focusImageIds(f){if(!f)return[];if(!Array.isArray(f.imageIds))f.imageIds=f.imageId?[f.imageId]:[];if(f.imageIds.length&&!f.imageId)f.imageId=f.imageIds[0];return f.imageIds}
function exerciseFocusIds(ex){if(!Array.isArray(ex.focusIds))ex.focusIds=[];return ex.focusIds}
function allExercises(){return ['drawing','painting'].flatMap(kind=>(state.exercises[kind]||[]).map(ex=>({kind,ex})))}
function focusNeedScore(f){const h=focusHistory(f);if(!h.length)return 92;const last=h[h.length-1].rating||3;const base={1:100,2:82,3:56,4:28,5:10}[last]||50;const due=Number(f.nextDue)||0;const overdue=due&&Date.now()>due?Math.min(30,(Date.now()-due)/86400000*5):0;return base+overdue}
function desiredDifficultyForFocus(f){const h=focusHistory(f);const r=h.length?h[h.length-1].rating:2;if(r<=2)return'easy';if(r===3)return'medium';return'hard'}
function recommendationForExercise(kind,ex){const linked=exerciseFocusIds(ex).map(id=>(state.focuses||[]).find(f=>f.id===id)).filter(Boolean);let score=0,reason='Mantém o treino andando';if(linked.length){const ranked=linked.map(f=>({f,need:focusNeedScore(f)})).sort((a,b)=>b.need-a.need);const top=ranked[0];score+=top.need*1.25;reason=`Ponto em foco: ${top.f.title}`;if(ex.difficulty===desiredDifficultyForFocus(top.f))score+=18}else{score+=18;reason='Exercício disponível para manter consistência'}const c=exCounts(ex);if(!c.done)score+=22;const age=ex.lastGuidedAt?Math.min(25,(Date.now()-ex.lastGuidedAt)/86400000*3):25;score+=age;const sessionSeen=new Set(guidedSession?.seen||[]);if(sessionSeen.has(ex.id))score-=80;return{kind,ex,score,reason,focus:linked.sort((a,b)=>focusNeedScore(b)-focusNeedScore(a))[0]||null}}
function chooseRecommendedExercise(){const pool=allExercises();if(!pool.length)return null;let ranked=pool.map(({kind,ex})=>recommendationForExercise(kind,ex)).sort((a,b)=>b.score-a.score);if(guidedSession?.seen?.length&&ranked.every(r=>(guidedSession.seen||[]).includes(r.ex.id)))guidedSession.seen=[];ranked=pool.map(({kind,ex})=>recommendationForExercise(kind,ex)).sort((a,b)=>b.score-a.score);return ranked[0]||null}
function startGuidedTraining(extra=false){if(!allExercises().length)return alert('Adicione pelo menos um exercício antes de iniciar o treino automático.');guidedSession={active:true,extra:!!extra,seen:[],current:null,reason:''};persistGuided();openNextGuidedExercise()}
function openNextGuidedExercise(){if(!guidedSession?.active)return;const rec=chooseRecommendedExercise();if(!rec)return alert('Não encontrei exercícios para recomendar.');guidedSession.current={kind:rec.kind,id:rec.ex.id};guidedSession.reason=rec.reason;guidedSession.seen=[...(guidedSession.seen||[]),rec.ex.id];persistGuided();route={page:'exercise',kind:rec.kind,id:rec.ex.id};render();setTimeout(()=>document.querySelector('.exercise-workspace')?.scrollIntoView({behavior:'smooth',block:'start'}),120)}
function completeGuidedExercise(){if(!guidedSession?.current)return;const {kind,id:exid}=guidedSession.current;const ex=state.exercises[kind].find(x=>x.id===exid);if(ex)ex.lastGuidedAt=Date.now();ensureTrainingLog().push({at:Date.now(),kind,exerciseId:exid});if(state.trainingLog.length>240)state.trainingLog.splice(0,state.trainingLog.length-240);save();const count=guidedDoneToday();if(!guidedSession.extra&&count>=3){guidedSession=null;persistGuided();route={page:'home'};render();window.scrollTo({top:0,behavior:'smooth'});return}openNextGuidedExercise()}
function stopGuidedTraining(){guidedSession=null;persistGuided();nav('home')}
function guidedBarHtml(kind,ex){if(!guidedSession?.active||guidedSession.current?.id!==ex.id)return'';return `<div class="guided-bar"><div class="guided-reason"><span class="guided-dot"></span><div><strong>Treino guiado</strong><span>${esc(guidedSession.reason||'Escolhido pelo sistema')}</span></div></div><div class="guided-actions"><button class="btn" onclick="stopGuidedTraining()">Sair</button><button class="btn green" onclick="completeGuidedExercise()">Concluir e continuar →</button></div></div>`}
function homeView(){return `${pageHead('Sistema','O que você vai fazer?')}<div class="choice-grid home-grid"><button class="choice" onclick="nav('training')"><span class="num">01</span><div><h2>Treino</h2><p>Escolha manualmente desenho, pintura e dificuldade.</p></div></button><button class="choice" onclick="nav('masters')"><span class="num">02</span><div><h2>Estudo de mestres</h2><p>Fundamentos, obras do mestre, anotações e prática.</p></div></button><button class="choice" onclick="nav('focus')"><span class="num">03</span><div><h2>Focos</h2><p>Princípios que reaparecem conforme sua proficiência.</p></div></button></div><div class="home-train-wrap"><button class="home-train-now" onclick="startGuidedTraining(guidedDoneToday()>=3)">Treinar agora</button></div>`}
function trainingView(){return `${pageHead('Treino','Treino')}<section class="guided-launch"><div class="guided-main"><div><div class="eyebrow">Recomendação</div><h2>Deixa o sistema escolher</h2><p>Ele prioriza os pontos mais fracos e escolhe uma dificuldade compatível com o momento.</p></div><button class="btn green" onclick="startGuidedTraining(${guidedDoneToday()>=3?'true':'false'})">Treinar agora →</button></div><aside class="guided-status"><div><div class="eyebrow">Manual</div><div class="meta">Se preferir, escolha uma área abaixo.</div></div></aside></section><div class="manual-label">Escolha manual</div><div class="choice-grid"><button class="choice" onclick="nav('exerciseList',{kind:'drawing'})"><span class="num">Desenho</span><div><h2>Desenho</h2><p>${state.exercises.drawing.length} exercício(s)</p></div></button><button class="choice" onclick="nav('exerciseList',{kind:'painting'})"><span class="num">Pintura</span><div><h2>Pintura</h2><p>${state.exercises.painting.length} exercício(s)</p></div></button></div>`}
function focusLinkPickerHtml(selected=[]){const focuses=state.focuses||[];if(!focuses.length)return `<div class="meta">Você ainda não criou focos. Pode vincular depois.</div>`;return `<div class="focus-choice-list">${focuses.map(f=>`<label class="focus-choice-row"><input type="checkbox" name="exerciseFocus" value="${f.id}" ${selected.includes(f.id)?'checked':''}><span>${esc(f.title)}<small>${esc(f.microSkill||'')}</small></span></label>`).join('')}</div>`}
function newExerciseView(kind){return `${pageHead(kindLabel(kind),'Novo exercício')}<div class="panel" style="max-width:700px"><div class="field"><label>Nome do exercício</label><input id="exTitle" class="input"></div><div class="field"><label>Dificuldade</label><div class="difficulty-picker"><label class="difficulty-option easy"><input type="radio" name="exDifficulty" value="easy" checked><span>Fácil</span></label><label class="difficulty-option medium"><input type="radio" name="exDifficulty" value="medium"><span>Médio</span></label><label class="difficulty-option hard"><input type="radio" name="exDifficulty" value="hard"><span>Difícil</span></label></div></div><div class="field"><label>Quais focos este exercício treina?</label>${focusLinkPickerHtml([])}</div><div class="counter-grid"><div class="field"><label>Quantidade com referência</label><input id="exRef" class="input" type="number" min="0" value="0"></div><div class="field"><label>Quantidade sem referência</label><input id="exNoRef" class="input" type="number" min="0" value="0"></div></div><button class="btn primary" onclick="createExercise('${kind}')">Salvar exercício</button></div>`}
function createExercise(kind){const title=document.getElementById('exTitle').value.trim(),ref=Number(document.getElementById('exRef').value),noref=Number(document.getElementById('exNoRef').value),difficulty=document.querySelector('input[name="exDifficulty"]:checked')?.value||'easy',focusIds=[...document.querySelectorAll('input[name="exerciseFocus"]:checked')].map(x=>x.value);if(!title)return alert('Informe o nome do exercício.');state.exercises[kind].push({id:id('ex'),title,difficulty,focusIds,refTarget:Math.max(0,ref),noRefTarget:Math.max(0,noref),entries:[]});save();nav('exerciseList',{kind})}
function exerciseFocusLinkerHtml(kind,ex){const focuses=state.focuses||[];if(!focuses.length)return'';return `<details class="exercise-focus-map"><summary>Focos que este exercício treina</summary><div class="focus-link-grid">${focuses.map(f=>`<button class="focus-link-toggle ${exerciseFocusIds(ex).includes(f.id)?'on':''}" onclick="toggleExerciseFocus('${kind}','${ex.id}','${f.id}')">${esc(f.title)}</button>`).join('')}</div></details>`}
function toggleExerciseFocus(kind,exid,fid){const ex=state.exercises[kind].find(x=>x.id===exid);if(!ex)return;const ids=exerciseFocusIds(ex);ex.focusIds=ids.includes(fid)?ids.filter(x=>x!==fid):[...ids,fid];save();render()}
function exerciseView(kind,exid){const ex=state.exercises[kind].find(x=>x.id===exid);if(!ex)return `<div class="empty">Exercício não encontrado.</div>`;const c=exCounts(ex);return `${guidedBarHtml(kind,ex)}<div class="exercise-header"><div class="hero"><div class="eyebrow">${kindLabel(kind)}</div><h1>${esc(ex.title)}</h1>${exerciseFocusLinkerHtml(kind,ex)}</div><div class="exercise-status">${difficultyChip(ex.difficulty)}<span class="status-chip ${c.ref>=ex.refTarget?'complete':''}">${c.ref} / ${ex.refTarget} referência</span><span class="status-chip ${c.noref>=ex.noRefTarget?'complete':''}">${c.noref} / ${ex.noRefTarget} imaginação</span>${c.done?'<span class="status-chip complete">Concluído</span>':''}</div></div><div class="exercise-workspace"><section class="exercise-zone" id="zone_ref" ondragenter="dragZone(event,'ref')" ondragover="dragZone(event,'ref')" ondragleave="leaveZone(event,'ref')" ondrop="dropExerciseFiles(event,'${kind}','${ex.id}','ref')"><div class="zone-head"><div class="zone-title"><h2>Referência</h2><span class="zone-count">${c.ref} / ${ex.refTarget}</span></div><span class="drop-hint">arraste aqui</span></div><div id="gallery_ref" class="zone-gallery"></div></section><section class="exercise-zone" id="zone_noref" ondragenter="dragZone(event,'noref')" ondragover="dragZone(event,'noref')" ondragleave="leaveZone(event,'noref')" ondrop="dropExerciseFiles(event,'${kind}','${ex.id}','noref')"><div class="zone-head"><div class="zone-title"><h2>Imaginação</h2><span class="zone-count">${c.noref} / ${ex.noRefTarget}</span></div><span class="drop-hint">arraste aqui</span></div><div id="gallery_noref" class="zone-gallery"></div></section></div>`}
function openNewFocus(){focusDraftFiles=[];nav('newFocus')}
function openEditFocus(fid){focusDraftFiles=[];nav('editFocus',{id:fid})}
function focusEditorMediaHtml(edit=false){return `<section class="focus-editor-media"><div class="focus-dropzone" id="focusDropzone" ondragenter="focusDrag(event,true)" ondragover="focusDrag(event,true)" ondragleave="focusDrag(event,false)" ondrop="focusDrop(event)"><label><strong>Arraste imagens para cá</strong><span>ou clique para escolher várias de uma vez</span><input id="focusImage" type="file" multiple accept="image/*" onchange="queueFocusFiles(this.files)"></label></div>${edit?'<div id="focusExistingImages" class="focus-preview-grid"></div>':''}<div id="focusDraftPreview" class="focus-preview-grid"></div><div class="focus-editor-hint">As imagens ficam juntas no mesmo princípio. Você pode usar detalhe, comparação, referência do mestre ou etapas diferentes.</div></section>`}
function newFocusView(){return `${pageHead('Focos','Novo foco','Um princípio pode ter várias imagens para reativar a mesma ideia por ângulos diferentes.')}<div class="focus-editor"><section class="focus-editor-form"><h2>Princípio</h2><div class="field"><label>Nome</label><input id="focusTitle" class="input" placeholder="Ex.: Cabeça como volume em perspectiva"></div><div class="field"><label>Conceito</label><textarea id="focusConcept" class="textarea" rows="6" placeholder="O que é e por que importa."></textarea></div><div class="field"><label>Micro-habilidade</label><textarea id="focusMicroSkill" class="textarea" rows="5" placeholder="O que exatamente você quer lembrar enquanto desenha."></textarea></div><div class="field"><label>Link no Course Vault (opcional)</label><input id="focusCourse" class="input" type="url" placeholder="https://..."></div><div class="focus-save-row"><button class="btn green" onclick="createFocus()">Salvar foco</button><button class="btn" onclick="nav('focus')">Cancelar</button></div></section>${focusEditorMediaHtml(false)}</div>`}
function editFocusView(fid){const f=(state.focuses||[]).find(x=>x.id===fid);if(!f)return `<div class="empty">Foco não encontrado.</div>`;return `${pageHead('Focos','Editar foco')}<div class="focus-editor"><section class="focus-editor-form"><h2>Princípio</h2><div class="field"><label>Nome</label><input id="focusTitle" class="input" value="${esc(f.title)}"></div><div class="field"><label>Conceito</label><textarea id="focusConcept" class="textarea" rows="6">${esc(f.concept)}</textarea></div><div class="field"><label>Micro-habilidade</label><textarea id="focusMicroSkill" class="textarea" rows="5">${esc(f.microSkill)}</textarea></div><div class="field"><label>Link no Course Vault</label><input id="focusCourse" class="input" type="url" value="${esc(f.courseUrl||'')}"></div><div class="focus-save-row"><button class="btn green" onclick="saveFocus('${fid}')">Salvar alterações</button><button class="btn" onclick="deleteFocus('${fid}')">Excluir foco</button></div></section>${focusEditorMediaHtml(true)}</div>`}
function focusDrag(e,on){e.preventDefault();e.stopPropagation();document.getElementById('focusDropzone')?.classList.toggle('dragging',!!on)}
function focusDrop(e){e.preventDefault();e.stopPropagation();focusDrag(e,false);queueFocusFiles(e.dataTransfer.files)}
function queueFocusFiles(fileList){const files=[...fileList].filter(f=>f.type.startsWith('image/'));if(!files.length)return;focusDraftFiles.push(...files);renderFocusDraftPreviews()}
function renderFocusDraftPreviews(){const el=document.getElementById('focusDraftPreview');if(!el)return;el.innerHTML=focusDraftFiles.map((file,i)=>`<div class="focus-preview-card"><img src="${URL.createObjectURL(file)}" alt="${esc(file.name)}"><button class="x" onclick="removeDraftFocusImage(${i})">×</button><span class="focus-preview-badge">nova</span></div>`).join('')}
function removeDraftFocusImage(i){focusDraftFiles.splice(i,1);renderFocusDraftPreviews()}
async function createFocus(){const title=document.getElementById('focusTitle').value.trim(),concept=document.getElementById('focusConcept').value.trim(),microSkill=document.getElementById('focusMicroSkill').value.trim(),courseUrl=document.getElementById('focusCourse').value.trim();if(!title||!concept||!microSkill||!focusDraftFiles.length)return alert('Preencha nome, conceito, micro-habilidade e adicione pelo menos uma imagem.');const imageIds=[];for(const file of focusDraftFiles)imageIds.push(await putImage(file,{kind:'focus'}));state.focuses.push({id:id('focus'),title,concept,microSkill,courseUrl,imageIds,imageId:imageIds[0],history:[],intervalDays:0,nextDue:Date.now(),createdAt:Date.now()});focusDraftFiles=[];save();nav('focus')}

EA.focusStrength=function(f){
 const h=focusHistory(f).slice(-5);if(!h.length)return null;
 let sum=0,total=0;h.forEach((x,i)=>{const weight=i+1;sum+=(Number(x.rating)||3)*weight;total+=weight});return sum/total;
};
EA.focusNeed=function(f){
 const strength=EA.focusStrength(f);if(strength===null)return 48; // desconhecido ≠ deficiente
 const due=(Number(f.nextDue)||0),over=due&&Date.now()>due?Math.min(12,(Date.now()-due)/86400000*2):0;
 return (6-strength)*18+over;
};
EA.focusWindow=function(){
 const now=Date.now(); const eligible=(state.focuses||[]).filter(f=>Number(f.deferUntil||0)<=now && (!focusHistory(f).length || Number(f.nextDue||0)<=now));
 return eligible.sort((a,b)=>{
  // revisões vencidas e introdução de novos princípios são intercaladas
  const aa=focusHistory(a).length?EA.focusNeed(a)+20:68;
  const bb=focusHistory(b).length?EA.focusNeed(b)+20:68;
  return bb-aa||(a.createdAt||0)-(b.createdAt||0);
 }).slice(0,3)
};
EA.mainFocus=function(){return EA.focusWindow()[0]||null};
EA.deferFocus=function(id){const f=EA.focusById(id);if(!f)return;f.deferUntil=Date.now()+12*3600000;save();render()};
EA.focusInterval=function(f,rating){
 const prev=Number(f.intervalDays)||0;
 const base={1:.5,2:2,3:5,4:10,5:24}[rating];
 if(!prev)return base;
 const h=focusHistory(f);const last=h.slice(-3);const sm=last.reduce((s,x,i)=>s+Number(x.rating)*(i+1),0)/last.reduce((s,_,i)=>s+i+1,0);
 if(rating<=2)return Math.max(.5,Math.min(base,prev*.75));
 if(rating===3)return Math.max(3,Math.min(9,prev*1.4));
 return Math.min(120,Math.max(2,prev*(sm>=4?2:1.55)));
};

 const f=EA.focusById(fid);if(!f||rating<1||rating>5)return;

 focusHistory(f).push({rating,at:now,source:'manual-focus'});
 if(f.history.length>100)f.history.splice(0,f.history.length-100);
 f.intervalDays=days;f.nextDue=now+days*86400000;f.deferUntil=0;
 save();showToast('Foco avaliado. Você pode continuar desenhando.');route={page:'focus'};render();
};

EA.levelValue=d=>({easy:1,medium:2,hard:3})[d]||1;
EA.challenge=function(ex){const foundation=EA.foundationById(ex.foundationId);return EA.levelValue(ex.difficulty)+(EA.complexity(foundation)-2)*.45};
EA.target=function(ex,intensity){
 const history=EA.history(ex);let target=.95;
 if(history.length){const avg=EA.ratingMean(ex);target=EA.challenge(ex)+(avg-3)*.42}
 return EA.clamp(target+(EA.intensityOffset[intensity]||0),.7,3.5)
};
EA.defaultIntensity=function(){
 const completed=(state.dailyCompletions||[]);const seq=['normal','light','hard','light','normal'];
 let selection=seq[completed.length%seq.length];
 const r=(state.exerciseSessions||[]).slice(-5).filter(x=>x.rating!=null);
 if(r.length>=3&&r.reduce((s,x)=>s+x.rating,0)/r.length<=2)selection='light';
 return selection;
};

EA.recommendation=function(kind,ex,intensity='normal',used=new Set(),chosenFoci=new Map()){
 const linked=EA.linked(ex);if(!EA.foundationById(ex.foundationId)||!linked.length)return null;
 const priorities=linked.map(f=>EA.focusNeed(f));
 const best=Math.max(...priorities);
 const untested=EA.history(ex).length===0;
 const focusStrength=EA.focusStrength(linked.slice().sort((a,b)=>EA.focusNeed(b)-EA.focusNeed(a))[0]);
 const focusAdjust=focusStrength===null?0:EA.clamp((focusStrength-3)*.15,-.3,.3);
 const target=EA.target(ex,intensity)+focusAdjust,gap=Math.abs(EA.challenge(ex)-target);
 const last=EA.history(ex).at(-1)?.at||ex.lastGuidedAt||0;
 const elapsed=last?(Date.now()-last)/86400000:120;
 const freshness=EA.clamp(elapsed*1.4,0,22);
 const distinct=linked.some(f=>!chosenFoci.has(f.id));
 const repetition=linked.reduce((s,f)=>s+(chosenFoci.get(f.id)||0),0);
 let score=best*1.35-gap*26+freshness+(untested?12:0)+(distinct?13:0)-repetition*16;
 if(used.has(ex.id))score-=210;
 const focus=linked.slice().sort((a,b)=>EA.focusNeed(b)-EA.focusNeed(a))[0];
 return {kind,ex,focus,score,reason:`${focus.title} · ${['','básico','intermediário','complexo'][EA.complexity(EA.foundationById(ex.foundationId))]} · nível ${difficultyLabel(ex.difficulty)}`};
};
EA.buildPlan=function(intensity='normal',amount=3){
 const pool=EA.validExercises();if(!pool.length)return [];
 const plan=[],used=new Set(),chosenFoci=new Map();
 for(let i=0;i<Math.min(amount,pool.length);i++){
  const ranked=pool.map(({kind,ex})=>EA.recommendation(kind,ex,intensity,used,chosenFoci)).filter(Boolean).sort((a,b)=>b.score-a.score);
  const best=ranked[0];if(!best)break;
  plan.push({kind:best.kind,id:best.ex.id,reason:best.reason,focusId:best.focus?.id||null});
  used.add(best.ex.id);
  for(const f of EA.linked(best.ex))chosenFoci.set(f.id,(chosenFoci.get(f.id)||0)+1);
 }
 return plan;
};

// Calibração por Foco + fundamento: dados dos exercícios equivalentes informam o desafio ideal.
// A complexidade do fundamento nunca desaparece inteiramente da comparação.
EA.validExercises=function(){
 const foundations=new Set((state.foundations||[]).map(f=>f.id));
 const focuses=new Set((state.focuses||[]).map(f=>f.id));
 return allExercises().filter(({ex})=>foundations.has(ex.foundationId)&&exerciseFocusIds(ex).some(id=>focuses.has(id)));
};
EA.recommendationContext=function(){
 const groups=new Map(), all=EA.validExercises();let count=0;
 const focusMap=new Map((state.focuses||[]).map(f=>[f.id,f]));
 const foundationMap=new Map((state.foundations||[]).map(f=>[f.id,f]));
 for(const {ex} of all){
  const f=foundationMap.get(ex.foundationId),levelBias=(EA.complexity(f)-2)*.45;
  count+=EA.history(ex).length;
  for(const focus of exerciseFocusIds(ex).map(id=>focusMap.get(id)).filter(Boolean)){
   const key=ex.foundationId+'|'+focus.id;
   if(!groups.has(key))groups.set(key,[]);
   const bucket=groups.get(key);
   for(const item of EA.history(ex).slice(-8)){
    const rating=Number(item.rating);
    if(!(rating>=1&&rating<=5))continue;
    const challenge=EA.levelValue(item.difficulty||ex.difficulty)+levelBias;
    bucket.push({at:Number(item.at)||0,challenge,rating});
   }
  }
 }
 for(const [key,samples] of groups)groups.set(key,samples.sort((a,b)=>b.at-a.at).slice(0,24));
 const sessions=(state.exerciseSessions||[]).length;
 return {groups,focusMap,foundationMap,round:Math.floor(Math.max(count,sessions)/3)};
};
EA.idealChallenge=function(ex,focus,intensity,ctx){
 const base=1.65;
 const samples=ctx.groups.get(ex.foundationId+'|'+focus.id)||[];
 let target=base;
 if(samples.length){
  let sum=0,weight=0;
  samples.forEach((s,i)=>{const w=1/(1+i*.18);sum+=(s.challenge+(s.rating-3)*.44)*w;weight+=w});
  const learned=sum/weight;
  // Mesmo quando há histórico, reserva-se alguma influência ao desafio absoluto.
  target=.83*learned+.17*base;
 }
 const focusStrength=EA.focusStrength(focus);
 const attentionAdjust=focusStrength===null?0:EA.clamp((focusStrength-3)*.06,-.12,.12);
 return EA.clamp(target+attentionAdjust+(EA.intensityOffset[intensity]||0),.65,3.5);
};
EA.recommendation=function(kind,ex,intensity='normal',used=new Set(),chosenFoci=new Map(),ctx=null){
 ctx=ctx||EA.recommendationContext();
 const foundation=ctx.foundationMap.get(ex.foundationId);
 const linked=exerciseFocusIds(ex).map(id=>ctx.focusMap.get(id)).filter(Boolean);
 if(!foundation||!linked.length)return null;
 const challenge=EA.levelValue(ex.difficulty)+(EA.complexity(foundation)-2)*.45;
 const focusOptions=linked.map(f=>({f,need:EA.focusNeed(f),target:EA.idealChallenge(ex,f,intensity,ctx)}));
 focusOptions.sort((a,b)=>b.need-a.need);
 const lead=focusOptions[0];
 const gap=Math.abs(challenge-lead.target);
 const last=EA.history(ex).at(-1)?.at||ex.lastGuidedAt||0;
 const elapsed=last?Math.max(0,(Date.now()-last)/86400000):120;
 const freshness=EA.clamp(elapsed*.65,0,13);
 const untested=EA.history(ex).length===0;
 const distinct=linked.some(f=>!chosenFoci.has(f.id));
 const repetition=linked.reduce((n,f)=>n+(chosenFoci.get(f.id)||0),0);
 const score=lead.need*1.25-gap*45+freshness+(untested?3:0)+(distinct?9:0)-repetition*13-(used.has(ex.id)?150:0);
 return {kind,ex,focus:lead.f,score,gap,target:lead.target,
  maintenance:EA.focusStrength(lead.f)!==null&&EA.focusStrength(lead.f)>=4,
  linked,reason:`${lead.f.title} · ${['','básico','intermediário','complexo'][EA.complexity(foundation)]} · nível ${difficultyLabel(ex.difficulty)}`};
};
EA.buildPlan=function(intensity='normal',amount=3,options={}){
 const pool=EA.validExercises(),plan=[],used=new Set(),chosenFoci=new Map();
 if(!pool.length)return plan;
 const ctx=EA.recommendationContext();
 const base=pool.map(({kind,ex})=>EA.recommendation(kind,ex,intensity,new Set(),new Map(),ctx)).filter(Boolean);
 const required=Math.max(1,Math.floor(amount));
 const maintenanceWindow=ctx.round>0&&ctx.round%4===3;
 for(let i=0;i<required;i++){
  if(used.size>=base.length)used.clear();
  const preferredMaintenance=maintenanceWindow&&i===required-1&&base.some(r=>r.maintenance&&!used.has(r.ex.id));
  let best=null,bestScore=-Infinity;
  for(const r of base){
   if(preferredMaintenance&&(!r.maintenance||used.has(r.ex.id)))continue;
   const linked=r.linked;
   const repetition=linked.reduce((n,f)=>n+(chosenFoci.get(f.id)||0),0);
   const lostDistinct=linked.every(f=>chosenFoci.has(f.id))?9:0;
   const score=r.score-(used.has(r.ex.id)?150:0)-repetition*13-lostDistinct;
   // Em manutenção, selecionar a prática menos recente em vez de só perseguir pontuação.
   const last=EA.history(r.ex).at(-1)?.at||0;
   const ranked=preferredMaintenance? -Math.min(Date.now(),last)/1e10+score*.001:score;
   if(ranked>bestScore){bestScore=ranked;best=r}
  }
  if(!best)break;
  plan.push({kind:best.kind,id:best.ex.id,reason:best.reason,focusId:best.focus?.id||null});
  used.add(best.ex.id);
  for(const f of best.linked)chosenFoci.set(f.id,(chosenFoci.get(f.id)||0)+1);
 }
 const master=EA.masterSuggestion();
 if(master&&plan.length>=3&&options.includeMaster!==false&&(options.includeMaster===true||
   (intensity==='light'&&ctx.round%3===2))){
  plan[2]={kind:'master',id:master.id,reason:'Aprofundamento opcional · '+master.name,
   fallback:plan[2]};
 }
 return plan;
};

EA.masterSuggestion=function(){
 const eligible=(state.foundations||[]).filter(f=>f.master||(f.artIds||[]).length);
 if(!eligible.length)return null;
 const pool=EA.validExercises();
 const ranked=eligible.map(f=>{
  const linked=new Set(f.focusIds||[]);
  for(const {ex} of pool)if(ex.foundationId===f.id)for(const fid of exerciseFocusIds(ex))linked.add(fid);
  const needs=[...linked].map(id=>EA.focusById(id)).filter(Boolean).map(x=>EA.focusNeed(x));
  return {f,score:needs.length?Math.max(...needs)+Math.min(20,needs.length*2):0};
 }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
 return ranked[0]?.f||null;
};

 if(current?.kind==='master'&&EA.foundationById(current.id))return current;

 const earlier=new Set(s.plan.slice(0,s.currentIndex).filter(x=>x.kind!=='master').map(x=>x.kind+'|'+x.id));
 const next=replacement.find(x=>!earlier.has(x.kind+'|'+x.id))||replacement[0];
 if(!next)return null;
 s.plan[s.currentIndex]=next;persistGuided();return next;
};

EA.completeDay=function(){

 if(!verified){
  if(EA.validExercises().length){
   const replacement=EA.buildPlan(s.intensity,3,{includeMaster:false})[0];
   if(replacement){s.plan.push(replacement);persistGuided();openNextGuidedExercise();return}

 }

   studyCount:studies,intensity:s.intensity,sessionId:s.sessionId});save();
 }
 guidedSession=null;persistGuided();route={page:'eaDone',extra:!!s.extra,finished:completed,intensity:s.intensity};render();
 window.scrollTo({top:0,behavior:'smooth'});
};

EA.showHomeBanner=async function(){
 const current=localStorage.getItem(EA.homeBannerKey),token=++EA.bannerLoadToken;

  const holder=document.getElementById('eaHomeBannerPicture');

  const url=URL.createObjectURL(image.blob),img=document.createElement('img');
  img.alt='Imagem escolhida para a capa do Evolução Art';
  img.onload=()=>URL.revokeObjectURL(url);
  img.onerror=()=>{URL.revokeObjectURL(url);holder.textContent='Não foi possível exibir a capa'};
  holder.replaceChildren(img);img.src=url;
 }catch(e){console.warn('Falha ao carregar a capa',e)}
};
EA.setHomeBanner=async function(file){
 if(!file)return;
 if(!file.type.startsWith('image/'))return alert('Escolha um arquivo de imagem.');

 let next=null;
 try{

 }catch(e){
  if(next){try{await deleteImage(next)}catch{}}

 }
 render();
 if(previous&&previous!==next){try{await deleteImage(previous)}catch(e){console.warn('Falha ao remover capa anterior',e)}}
};
EA.removeHomeBanner=async function(){

 try{localStorage.removeItem(EA.homeBannerKey)}catch{return alert('Não foi possível remover a capa.')}

EA.loadImportFile=async function(file){
 if(!file)return;
 if(file.size>2*1024*1024){alert('O arquivo excede o limite de 2 MB. Divida o sistema em pacotes menores.');return}
 try{EA.importDraft=await file.text();document.getElementById('eaImportData').value=EA.importDraft;EA.previewImport()}

EA.previewImport=function(){
 const txt=document.getElementById('eaImportData')?.value||'';
 EA.importDraft=txt;EA.importPreview=null;
 const holder=document.getElementById('eaImportResult');if(!holder)return;
 if(!txt.trim()){holder.innerHTML='<p>Cole um pacote JSON ou selecione um arquivo.</p>';return}
 if(txt.length>2*1024*1024){holder.innerHTML='<p class="ea-import-error">Pacote muito grande. Limite de 2 MB.</p>';return}
 let report;try{report=EvolucaoImport.plan(txt,state)}catch(e){holder.innerHTML=`<p class="ea-import-error">${esc(e?.message||String(e))}</p>`;return}
 EA.importPreview=report;
 const c=report.counts;
 const counts=`<div class="ea-import-counts"><span><strong>${c.foundations}</strong> fundamento(s)</span><span><strong>${c.focuses}</strong> Foco(s)</span><span><strong>${c.exercises}</strong> exercício(s)</span><span><strong>${c.existing}</strong> já importado(s)</span></div>`;
 const titles=[...report.newItems.foundations.map(x=>'Fundamento: '+x.name),...report.newItems.focuses.map(x=>'Foco: '+x.title),...report.newItems.exercises.map(x=>'Exercício: '+x.title)];
 const errors=report.errors.map(x=>`<p class="ea-import-error">${esc(x)}</p>`).join('');
 const warnings=report.warnings.map(x=>`<p class="ea-import-info">${esc(x)}</p>`).join('');
 holder.innerHTML=`<h3>${esc(report.doc.name)}</h3>${counts}${errors}${warnings}${titles.length?`<p>Itens novos:</p><ul class="ea-import-list">${titles.slice(0,50).map(x=>`<li>${esc(x)}</li>`).join('')}${titles.length>50?`<li>+${titles.length-50} itens</li>`:''}</ul>`:'<p>Nenhum item novo a adicionar.</p>'}
 ${report.errors.length?'<p class="ea-import-error">Corrija os erros no pacote antes de importar.</p>':`<button class="ea-import-importbtn" type="button" onclick="EA.commitImport()" ${!titles.length?'disabled':''}>Importar ${titles.length} item(ns)</button>`}`;
};
EA.commitImport=function(){
 const raw=document.getElementById('eaImportData')?.value||'';
 const result=document.getElementById('eaImportResult');
 let report,next;
 try{
   // Revalidar no instante da gravação, pois o arquivo/dados podem ter mudado após a prévia.
   report=EvolucaoImport.plan(raw,state);
   if(report.errors.length)throw Error('Foram encontrados conflitos; revise a prévia novamente.');
   if(!report.counts.foundations&&!report.counts.focuses&&!report.counts.exercises)throw Error('Nenhum item novo para importar.');
   next=EvolucaoImport.apply(report,state,id,Date.now());
   const backup=JSON.stringify(state);
   // Sem backup verificável, não prosseguir: nenhuma mudança será feita.
   localStorage.setItem('ea-last-import-backup-v1',backup);
 }catch(e){if(result)result.innerHTML=`<p class="ea-import-error">Importação cancelada: ${esc(e?.message||String(e))}. Nenhum cadastro foi alterado.</p>`;return}
 const before=state;
 try{state=next;save();EA.importDraft='';EA.importPreview=null;
  if(result)result.innerHTML=`<p class="ea-import-success">Sistema importado: ${report.counts.foundations} fundamento(s), ${report.counts.focuses} Foco(s), ${report.counts.exercises} exercício(s). Os registros anteriores foram preservados.</p><button class="btn" onclick="nav('training')">Voltar ao Treino</button>`;
  const box=document.getElementById('eaImportData');if(box)box.value='';
 }catch(e){state=before;try{save()}catch{};if(result)result.innerHTML=`<p class="ea-import-error">Não foi possível gravar: ${esc(e?.message||String(e))}. O estado anterior foi restaurado.</p>`}
};

};

 <div class="exercise-cards">${list.length?list.map((ex,i)=>{

exerciseView=function(kind,exid){
 let html=eaUnifiedPriorExerciseView(kind,exid);
 const ex=state.exercises?.[kind]?.find(x=>x.id===exid);
 if(!ex)return html;

 // Remove misleading, permanent completion badges inherited from the legacy editor.
 html=html.replace(/<div class="exercise-status">[\s\S]*?<\/div>/,
   `<div class="exercise-status">${difficultyChip(ex.difficulty)}<span class="status-chip">${c.sessions} sessão(ões) avaliada(s)</span><span class="status-chip">${c.ref} com referência · ${c.noref} sem referência</span></div>`);
 let z=0;
 html=html.replace(/<span class="zone-count">[^<]*<\/span>/g,()=>`<span class="zone-count">${z++===0?c.ref:c.noref} estudo(s)</span>`);
 // Existing reference quotas are not exercise completion conditions.
 html=html.replace(/<div class="eyebrow">SESSÃO ATUAL<\/div><p>[\s\S]*?<\/p>/,
   '<div class="eyebrow">PRÁTICA LIVRE</div><p>Realize uma sessão desta atividade. Ao terminar, avalie a dificuldade encontrada. A recomendação usa seu histórico, não uma quantidade fixa de imagens ou folhas.</p>');
 const sourceNotes=ex.sourceNotes||(
  ex.progressMode==='prtp'?'Método anterior (PRTP): três execuções-base e duas de imaginação para cada uma; também era possível praticar apenas de imaginação.':

  (Number(ex.refTarget)||Number(ex.noRefTarget))?`Metas anteriores: ${Number(ex.refTarget)||0} com referência e ${Number(ex.noRefTarget)||0} sem referência.`:''
 );
 if(sourceNotes)html+=`<details class="ea-panel" style="margin-top:12px"><summary style="cursor:pointer;font-size:12px;color:#999">Informações do plano original</summary><p style="white-space:pre-wrap">${esc(sourceNotes)}</p><p>Esta informação não controla suas avaliações nem a seleção do Treinar agora.</p></details>`;

EA.updatePreference=function(which,value){
 const p=EA.trainingPreferences;
 const difficulty=which==='difficulty'?value:p.difficulty;
 const intensity=which==='intensity'?(value==='auto'?null:value):p.intensity;
 if(!['accessible','middle','challenging'].includes(difficulty)||![null,'light','normal','hard'].includes(intensity))return;
 EA.storeTrainingPreferences(difficulty,intensity);
 EA.userIntensity=intensity;
 render();
};

EA.v13={expanded:{drawing:{},painting:{}}, masterExpanded:{drawing:{},painting:{}}, masterBackArea:null,undo:null};
EA.v13Area=function(f,kind){
 const matched=['drawing','painting'].filter(k=>(state.exercises?.[k]||[]).some(ex=>ex.foundationId===f.id));
 if(matched.length)return matched.includes(kind);
 if(f.area==='drawing'||f.area==='painting')return f.area===kind;
 const n=(f.name||'').toLocaleLowerCase('pt-BR');
 if(/perspect|silhuet|proporç|gestual|figura|anatom|anima|vestiment|design/.test(n))return kind==='drawing';
 if(/luz|valores|materiais|cores|edge|pintura/.test(n))return kind==='painting';
 return true; // Unclassified user-created foundations remain discoverable in both areas.
};
EA.v13Groups=function(kind){
 const exercises=state.exercises?.[kind]||[];
 const foundations=state.foundations||[];
 const groups=foundations.map(f=>({f,items:exercises.filter(ex=>ex.foundationId===f.id)})).filter(x=>x.items.length);
 const validIds=new Set(foundations.map(f=>f.id));
 const orphaned=exercises.filter(ex=>!validIds.has(ex.foundationId));
 if(orphaned.length)groups.push({f:{id:'unassigned_'+kind,name:'Sem fundamento'},items:orphaned});
 return groups;
};

EA.v14Saving=false;
EA.v14SavePage=async function(){
 if(EA.v14Saving)return;
 const d=EA.v14Draft;if(!d)return;const f=EA.focusById(d.id);if(!f)return;
 if(!d.title.trim())return alert('Escreva um título para o Foco.');
 EA.v14Saving=true;
 const uploaded=[];const snapshot={title:f.title,concept:f.concept,microSkill:f.microSkill,pageBlocks:f.pageBlocks,imageIds:f.imageIds,imageId:f.imageId};
 try{
  const blocks=[];
  for(const b of d.blocks){
   if(b.type==='text'){if(b.text?.trim())blocks.push({type:'text',text:String(b.text).trim()})}
   else if(b.type==='image'){
    let imageId=b.imageId;
    if(b.file){imageId=await putImage(b.file,{kind:'focus'});uploaded.push(imageId)}
    if(imageId)blocks.push({type:'image',imageId});
   }
  }
  f.title=d.title.trim();f.concept=d.concept.trim();f.microSkill=d.microSkill.trim();
  f.pageBlocks=blocks;f.imageIds=blocks.filter(b=>b.type==='image').map(b=>b.imageId);f.imageId=f.imageIds[0]||null;
  save();

   if(block.localKey){const file=EA.v15Files.get(block.localKey);if(!file)throw new Error('Imagem temporária não encontrada');imageId=await putImage(file,{kind:'focus'});uploaded.push(imageId)}

 A.v14FocusReader=A.v15FocusReader;
 const v19PriorShowFocusCard=A.showFocusCard;
 A.showFocusCard=function(...args){if(E.draft?.type==='focus'&&!E.close())return;return v19PriorShowFocusCard(...args)};
 // Master notes are edited in the same surface (creation retains familiar flow).
 const oldEditNote=A.v16EditNote;
 A.v16EditNote=function(nid,fid){if(nid)return E.open('note',nid);return E.newNote(fid)};
 A.v13EditInsight=function(nid){E.open('note',nid)};
 const oldModal=A.v13InsightOptions;
 A.v13InsightOptions=function(nid){const n=E.find('note',nid);if(!n)return;
  A.v13Modal(`<h2>${esc(n.label||'Descoberta')}</h2>${E.renderRead('note',nid)}<div class="ea-v13-modal-actions"><button class="ea-v13-modal-secondary" onclick="EA.v13ModalClose()">Voltar</button><button class="ea-v13-modal-primary" onclick="EA.v13ModalClose();EA.editor.open('note','${nid}')">Editar</button></div>`);void E.hydrateRead(document.getElementById('eaV13NoteModal'));
 };
 // Use the same editor instead of the old exercise form or foundation rename form.
 const previousNav=nav;
 nav=function(page,extra={}){
  if(E.draft&&!E.close())return;
  if(E.galleryPending?.size&&page!==route.page){
   if(!confirm('Descartar alterações não salvas nas obras?'))return;
   E.galleryPending.clear();
  }
  if(page==='editExercise'&&extra.id){E.open('exercise',extra.id);return;}
  if(page==='editFoundation'&&extra.id){E.open('foundation',extra.id);return;}
  return previousNav(page,extra);
 };
 const oldCategoryView=A.v13MasterAreaView;
 A.v13MasterAreaView=function(kind){return oldCategoryView(kind).replace(/<summary class="ea-v13-category-summary">/g,'<summary class="ea-v13-category-summary">').replace(/(<div class="ea-v13-gallery-tools">)/g,'$1');};
 const oldMasterAreaRender=render;
 render=function(){
  oldMasterAreaRender();
  if(E.draft){
   const d=E.draft;
   const belongs=d.type==='focus'?route.page==='focus'&&EA.focusDetailOpen&&routedFocus()?.id===d.key:
     d.type==='foundation'?route.page==='masterArea'||route.page==='exerciseList'||route.page==='foundation':
     d.type==='exercise'?route.page==='exercise'||route.page==='exerciseList':
     d.type==='note'?route.page==='masterArea'||route.page==='notesBank':true;
   if(!belongs){E.close(true);return;}
   if(!document.getElementById('eaV18Overlay'))E.render();return;
  }
  if(route.page==='focus'&&EA.focusDetailOpen){
   const f=typeof routedFocus==='function'?routedFocus():null;
   if(f){E.open('focus',f.id,{auto:true});return;}
  }
  void E.hydrateRead(document);
 };
 // Category tools are available on demand, never shown as Foco clouds in read mode.
 const prevMasterArea=A.v13MasterAreaView;
 A.v13MasterAreaView=function(kind){const categories=state.foundations.filter(f=>A.v13Area(f,kind));let i=0;
  return prevMasterArea(kind).replaceAll('<div class="ea-v13-gallery-tools">',()=>{
   const f=categories[i++];return `<div class="ea-v13-gallery-tools"><button type="button" class="ea-v13-link" onclick="EA.editor.open('foundation','${f.id}')">Editar categoria</button><button type="button" class="ea-v13-link" onclick="EA.editor.newNote('${f.id}')">+ Anotação</button>`;
  });
 };
 const prevList=exerciseListView;
 exerciseListView=function(kind){const html=prevList(kind),groups=A.v13Groups(kind);
  let i=0;return html.replaceAll('<div class="ea-v13-category-body">',()=>{
   const f=groups[i++]?.f;
   return `<div class="ea-v13-category-body">${f&&!f.id.startsWith('unassigned_')?`<button type="button" class="ea-v13-link" onclick="EA.editor.open('foundation','${f.id}')">Editar categoria</button>`:''}`;
  });
 };

 // The existing master gallery is directly rearrangeable without opening an editor.
 E.galleryPending=new Map();E.galleryDrag=null;
 E.galleryItems=function(fid){
  if(E.galleryPending.has(fid))return E.galleryPending.get(fid);
  const f=E.find('foundation',fid);return(f?.artIds||[]).map(imageId=>({imageId}));
 };
 E.galleryBegin=function(event,fid,imageId){
  if(E.draft)return;event.stopPropagation();E.galleryDrag={fid,imageId};
  event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('application/x-ea-gallery',JSON.stringify(E.galleryDrag));
 };
 E.galleryOver=function(event){const dt=event.dataTransfer;if(E.galleryDrag||[...(dt?.types||[])].includes('Files')){event.preventDefault();dt.dropEffect=E.galleryDrag?'move':'copy'}};
 E.galleryDrop=function(event,fid,imageId){
  if(E.draft)return;
  const data=E.galleryDrag;E.galleryDrag=null;
  if(data&&data.fid===fid){
   event.preventDefault();event.stopPropagation();if(data.imageId===imageId)return;
   const entries=E.galleryItems(fid).slice(),from=entries.findIndex(x=>x.imageId===data.imageId),to=entries.findIndex(x=>x.imageId===imageId);
   if(from<0||to<0)return;
   const [item]=entries.splice(from,1);entries.splice(to,0,item);E.galleryPending.set(fid,entries);E.galleryRedraw(fid);
   return;
  }
  const files=E.imageFiles(event.dataTransfer);if(!files.length)return;
  event.preventDefault();event.stopPropagation();const entries=E.galleryItems(fid).slice();
  const at=entries.findIndex(x=>x.imageId===imageId);
  for(const file of files)entries.splice(at<0?entries.length:at,0,{file,token:uid()});
  E.galleryPending.set(fid,entries);E.galleryRedraw(fid);
 };
 E.galleryRedraw=function(fid){
  const wall=document.getElementById('eaV13Arts_'+fid),entries=E.galleryItems(fid);if(!wall)return;
  const existing=new Map([...wall.querySelectorAll('.ea-v13-art-tile')].map(t=>[t.dataset.v19ImageId,t]));
  const elements=[];
  for(const item of entries){
   const key=item.imageId||item.token;let tile=existing.get(key);
   if(!tile){tile=document.createElement('button');tile.type='button';tile.className='ea-v13-art-tile';const img=document.createElement('img');img.alt='Nova obra';img.draggable=false;img.src=URL.createObjectURL(item.file);E.urls.push(img.src);tile.append(img)}
   tile.dataset.v19ImageId=key;tile.draggable=true;
   tile.ondragstart=e=>{if(item.imageId)E.galleryBegin(e,fid,item.imageId);else{e.preventDefault()}};
   tile.ondragover=e=>E.galleryOver(e);tile.ondrop=e=>E.galleryDrop(e,fid,key);
   elements.push(tile);
  }
  wall.replaceChildren(...elements);
  const category=wall.closest('.ea-v13-master-category');let bar=category?.querySelector('.ea-v19-gallery-save');
  if(!bar){bar=document.createElement('div');bar.className='ea-v19-gallery-save';bar.innerHTML='<span>Alterações nas obras</span><button type="button" data-action="cancel">Desfazer</button><button type="button" data-action="save">Salvar</button>';category?.querySelector('.ea-v13-category-body')?.appendChild(bar);
   bar?.querySelector('[data-action=cancel]')?.addEventListener('click',()=>{E.galleryPending.delete(fid);render()});
   bar?.querySelector('[data-action=save]')?.addEventListener('click',()=>void E.gallerySave(fid));
  }
 };
 E.gallerySave=async function(fid){
  const f=E.find('foundation',fid),entries=E.galleryPending.get(fid);if(!f||!entries)return;
  const original=[...(f.artIds||[])],oldBlocks=clone(f.editorBlocks||[]),uploaded=[];
  try{
   const ids=[];for(const item of entries){let imageId=item.imageId;if(!imageId&&item.file){imageId=await putImage(item.file,{kind:'master',foundationId:fid});uploaded.push(imageId)}if(imageId)ids.push(imageId)}
   const existing=normalize(f.editorBlocks||[]);let index=0;const rebuilt=[];
   for(const block of existing){
    if(block.type==='text'){rebuilt.push(block);continue;}
    const next=ids.slice(index,index+block.images.length);index+=next.length;
    if(next.length)rebuilt.push({...block,images:next.map((imageId,j)=>({...block.images[j],imageId}))});
   }
   for(const imageId of ids.slice(index))rebuilt.push({type:'row',id:uid(),images:[{id:uid(),imageId,width:100,align:'center'}]});
   f.artIds=ids;f.editorBlocks=rebuilt;
   save();E.galleryPending.delete(fid);render();
  }catch(error){f.artIds=original;f.editorBlocks=oldBlocks;for(const imageId of uploaded)try{await deleteImage(imageId)}catch{};console.error(error);alert('Não foi possível salvar as obras. Tente novamente.')}
 };

 E.galleryPaste=function(event,fid){
  const files=E.imageFiles(event.clipboardData);if(!files.length)return;
  event.preventDefault();event.stopImmediatePropagation();E.galleryDrag=null;
  const entries=E.galleryItems(fid).slice();for(const file of files)entries.push({file,token:uid()});
  E.galleryPending.set(fid,entries);E.galleryRedraw(fid);
 };
 document.addEventListener('paste',event=>{
  if(E.draft||route.page!=='masterArea'||event.target?.closest?.('input,textarea,[contenteditable]'))return;
  const open=[...document.querySelectorAll('.ea-v13-master-category[open]')];if(open.length!==1)return;
  const wall=open[0].querySelector('.ea-v13-artwork-wall');const fid=wall?.id?.replace('eaV13Arts_','');
  if(fid)E.galleryPaste(event,fid);
 },true);
 const v19PreviousGalleryLoad=A.v13MasterGalleryLoad;
 A.v13MasterGalleryLoad=async function(kind){
  await v19PreviousGalleryLoad(kind);
  for(const f of state.foundations.filter(x=>A.v13Area(x,kind))){
   const wall=document.getElementById('eaV13Arts_'+f.id);if(!wall)continue;
   if(E.galleryPending.has(f.id)){E.galleryRedraw(f.id);continue;}
   wall.ondragover=e=>E.galleryOver(e);wall.ondrop=e=>E.galleryDrop(e,f.id,null);
   const tiles=[...wall.querySelectorAll('.ea-v13-art-tile')];
   tiles.forEach((tile,i)=>{
    const imageId=(f.artIds||[])[i];if(!imageId)return;
    tile.dataset.v19ImageId=imageId;tile.draggable=true;
    tile.ondragstart=e=>E.galleryBegin(e,f.id,imageId);
    tile.ondragend=()=>{E.galleryDrag=null};
    tile.ondragover=e=>E.galleryOver(e);tile.ondrop=e=>E.galleryDrop(e,f.id,imageId);
    const img=tile.querySelector('img');if(img)img.draggable=false;
    const author=f.artists?.[imageId]||'';
    if(author){
     let credit=tile.querySelector('.ea-v19-artist-credit');if(!credit){credit=document.createElement('div');credit.className='ea-v19-artist-credit';tile.append(credit)}
     credit.textContent=author;
    }
   });
  }
 };

 // Contextual edit actions are delegated so they do not clutter view-only galleries.
 document.addEventListener('contextmenu',event=>{
  if(E.draft)return;
  const tile=event.target.closest?.('.ea-v13-art-tile');if(tile){
   const wall=tile.closest('.ea-v13-artwork-wall'),fid=wall?.id?.replace('eaV13Arts_','');
   const imageId=tile.getAttribute('onclick')?.match(/viewArt\('([^']+)'\)/)?.[1];
   if(fid){event.preventDefault();E.open('foundation',fid,{imageId,context:true,x:event.clientX,y:event.clientY})}
  }
 });
 document.addEventListener('click',event=>{if(E.menu&&!event.target.closest('#eaV18Menu')&&!event.target.closest('.ea-v18-photo')){E.menu.remove();E.menu=null}},true);
 document.addEventListener('keydown',event=>{if(!E.draft)return;if(event.key==='Escape'&&E.menu){E.menu.remove();E.menu=null;return}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'){event.preventDefault();E.save()}},true);
})();
/* END EA_SHARED_EDITOR_v18 */

</script>
