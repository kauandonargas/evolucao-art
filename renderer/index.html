EA.homeBannerHtml=function(){
 const hasBanner=!!localStorage.getItem(EA.homeBannerKey);
 return `<section class="ea-home-banner ${hasBanner?'has-image':''}" id="eaHomeBanner" aria-label="Capa da página inicial">
   <div id="eaHomeBannerPicture" class="${hasBanner?'ea-home-banner-media':'ea-home-banner-empty'}">${hasBanner?'':'Sua capa, se quiser.'}</div>
   <div class="ea-home-banner-toolbar"><button id="eaBannerMenuButton" type="button" class="ea-banner-iconbtn"
     title="Personalizar capa" aria-label="Personalizar capa" aria-haspopup="menu" aria-expanded="false" onclick="EA.toggleBannerMenu()">${hasBanner?'Editar capa':'Adicionar capa'}</button></div>
   <div class="ea-banner-pop" id="eaBannerMenu" ${EA.bannerMenuOpen?'':'hidden'}>${EA.bannerMenuInner()}</div>
 </section>`;
};
const eaV10ShowBanner=EA.showHomeBanner;
EA.showHomeBanner=async function(){
 await eaV10ShowBanner();
 const img=document.querySelector('#eaHomeBannerPicture img');
 if(img)img.style.objectPosition=`center ${EA.getHomeBannerPos()}%`;
};
const eaV10SetBanner=EA.setHomeBanner;
EA.onBannerFile=async function(file){
 if(!file)return;
 const old=localStorage.getItem(EA.homeBannerKey);
 EA.toggleBannerMenu(false);
 await eaV10SetBanner(file);
 const next=localStorage.getItem(EA.homeBannerKey);
 if(next!==old){try{localStorage.setItem(EA.homeBannerPosKey,'50')}catch{}EA.setHomeBannerPos(50)}
};
const eaV10RemoveBanner=EA.removeHomeBanner;
EA.removeHomeBanner=async function(){
 EA.toggleBannerMenu(false);
 await eaV10RemoveBanner();
 try{localStorage.removeItem(EA.homeBannerPosKey)}catch{}
};
// Preserve all original views; only replace the final home view.
homeView=function(){
 return `${EA.homeBannerHtml()}<div class="ea-home-content">
   <div class="choice-grid home-grid home-center-grid">
     <button class="choice" onclick="nav('training')"><div><h3>Treino</h3><p>Desenho e pintura</p></div></button>
     <button class="choice" onclick="nav('masters')"><div><h3>Estudo de Mestres</h3><p>Observar, comparar e registrar</p></div></button>
     <button class="choice" onclick="nav('focus')"><div><h3>Focos</h3><p>Princípios para incorporar</p></div></button>
   </div>
   <div class="home-subtle-actions"><button type="button" class="linklike" onclick="EA.openSettings()">Preferências e rotina</button></div>
 </div>`;
};
// Settings are explicitly opened by the user; onboarding still runs only on first launch.
EA.settingsOnly=false;
EA.openSettings=function(){
 EA.settingsOnly=true;
 EA.openIntro(true);
 EA.introState.step=1;
 EA.renderIntro();
};
const eaV9RenderIntro=EA.renderIntro;
EA.renderIntro=function(){
 eaV9RenderIntro();
 if(!EA.settingsOnly||EA.introState.step!==2)return;
 const target=document.getElementById('eaIntroBody');if(!target)return;
 const begin=target.querySelector('button[onclick="EA.introFinish(true)"]');if(begin)begin.remove();
 const leave=target.querySelector('button[onclick="EA.introFinish(false)"]');
 if(leave){leave.textContent='Salvar preferências';leave.classList.add('primary')}
};
const eaV9IntroFinish=EA.introFinish;
EA.introFinish=function(begin){
 const settingsOnly=EA.settingsOnly;
 EA.settingsOnly=false;
 eaV9IntroFinish(settingsOnly?false:begin);
};
const eaV9TrainingView=trainingView;
trainingView=function(){
 return eaV9TrainingView().replace('onclick="EA.openIntro(true)"','onclick="EA.openSettings()"');
};
// Close the editing menu when clicking elsewhere, without changing the other pages.
document.addEventListener('pointerdown',event=>{
 if(!EA.bannerMenuOpen||route.page!=='home')return;
 if(!document.getElementById('eaHomeBanner')?.contains(event.target))EA.toggleBannerMenu(false);
});
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&EA.bannerMenuOpen){EA.toggleBannerMenu(false);document.getElementById('eaBannerMenuButton')?.focus()}
});


/* BEGIN EA_BATCH_UI_v1 */
EA.importDraft='';
EA.importPreview=null;
const eaBatchPriorTrainingView=trainingView;
trainingView=function(){return eaBatchPriorTrainingView()+`<div class="ea-import-quiet"><button class="ea-import-link" type="button" onclick="nav('eaImport')">Importar sistema de estudos…</button></div>`};
EA.importPage=function(){return `<div class="ea-import-page">${pageHead('Treino','Importar sistema de estudos','Adicione vários Focos, fundamentos e exercícios de uma só vez, com seus vínculos.')}
 <section class="ea-import-box"><label for="eaImportData">Pacote preparado para o Evolução Art (.json)</label>
 <textarea id="eaImportData" spellcheck="false" placeholder="Cole aqui o conteúdo JSON que eu preparar, ou selecione um arquivo .json.">${esc(EA.importDraft)}</textarea>
 <div class="ea-import-toolbar"><label class="ea-import-upload">Escolher arquivo JSON<input id="eaImportFile" type="file" accept="application/json,.json" onchange="EA.loadImportFile(this.files[0])"></label><button class="btn" type="button" onclick="EA.previewImport()">Verificar e visualizar</button></div>
 <p class="ea-import-info">O aplicativo não interpreta texto livre. Você pode me mandar seu sistema em linguagem natural; eu o converto para este formato. A importação não altera avaliações nem remove registros existentes.</p></section>
 <section class="ea-import-box" id="eaImportResult" aria-live="polite"><p>Uma prévia aparecerá aqui antes de qualquer alteração.</p></section></div>`};
EA.loadImportFile=async function(file){
 if(!file)return;
 if(file.size>2*1024*1024){alert('O arquivo excede o limite de 2 MB. Divida o sistema em pacotes menores.');return}
 try{EA.importDraft=await file.text();document.getElementById('eaImportData').value=EA.importDraft;EA.previewImport()}
 catch(e){alert('Não foi possível ler o arquivo: '+String(e?.message||e))}
};
EA.previewImport=function(){
 const txt=document.getElementById('eaImportData')?.value||'';
 EA.importDraft=txt;EA.importPreview=null;
 const holder=document.getElementById('eaImportResult');if(!holder)return;
 if(!txt.trim()){holder.innerHTML='<p>Cole um pacote JSON ou selecione um arquivo.</p>';return}
 if(txt.length>2*1024*1024){holder.innerHTML='<p class="ea-import-error">Pacote muito grande. Limite de 2 MB.</p>';return}
 let report;try{report=EvolucaoImport.plan(txt,state)}catch(e){holder.innerHTML=`<p class="ea-import-error">${esc(e?.message||String(e))}</p>`;return}
 EA.importPreview=report;
 const c=report.counts;
 const counts=`<div class="ea-import-counts"><span><strong>${c.foundations}</strong> fundamento(s)</span><span><strong>${c.focuses}</strong> Foco(s)</span><span><strong>${c.exercises}</strong> exercício(s)</span><span><strong>${c.existing}</strong> já importado(s)</span></div>`;
 const titles=[...report.newItems.foundations.map(x=>'Fundamento: '+x.name),...report.newItems.focuses.map(x=>'Foco: '+x.title),...report.newItems.exercises.map(x=>'Exercício: '+x.title)];
 const errors=report.errors.map(x=>`<p class="ea-import-error">${esc(x)}</p>`).join('');
 const warnings=report.warnings.map(x=>`<p class="ea-import-info">${esc(x)}</p>`).join('');
 holder.innerHTML=`<h3>${esc(report.doc.name)}</h3>${counts}${errors}${warnings}${titles.length?`<p>Itens novos:</p><ul class="ea-import-list">${titles.slice(0,50).map(x=>`<li>${esc(x)}</li>`).join('')}${titles.length>50?`<li>+${titles.length-50} itens</li>`:''}</ul>`:'<p>Nenhum item novo a adicionar.</p>'}
 ${report.errors.length?'<p class="ea-import-error">Corrija os erros no pacote antes de importar.</p>':`<button class="ea-import-importbtn" type="button" onclick="EA.commitImport()" ${!titles.length?'disabled':''}>Importar ${titles.length} item(ns)</button>`}`;
};
EA.commitImport=function(){
 const raw=document.getElementById('eaImportData')?.value||'';
 const result=document.getElementById('eaImportResult');
 let report,next;
 try{
   // Revalidar no instante da gravação, pois o arquivo/dados podem ter mudado após a prévia.
   report=EvolucaoImport.plan(raw,state);
   if(report.errors.length)throw Error('Foram encontrados conflitos; revise a prévia novamente.');
   if(!report.counts.foundations&&!report.counts.focuses&&!report.counts.exercises)throw Error('Nenhum item novo para importar.');
   next=EvolucaoImport.apply(report,state,id,Date.now());
   const backup=JSON.stringify(state);
   // Sem backup verificável, não prosseguir: nenhuma mudança será feita.
   localStorage.setItem('ea-last-import-backup-v1',backup);
 }catch(e){if(result)result.innerHTML=`<p class="ea-import-error">Importação cancelada: ${esc(e?.message||String(e))}. Nenhum cadastro foi alterado.</p>`;return}
 const before=state;
 try{state=next;save();EA.importDraft='';EA.importPreview=null;
  if(result)result.innerHTML=`<p class="ea-import-success">Sistema importado: ${report.counts.foundations} fundamento(s), ${report.counts.focuses} Foco(s), ${report.counts.exercises} exercício(s). Os registros anteriores foram preservados.</p><button class="btn" onclick="nav('training')">Voltar ao Treino</button>`;
  const box=document.getElementById('eaImportData');if(box)box.value='';
 }catch(e){state=before;try{save()}catch{};if(result)result.innerHTML=`<p class="ea-import-error">Não foi possível gravar: ${esc(e?.message||String(e))}. O estado anterior foi restaurado.</p>`}
};
const eaBatchPriorRender=render;
render=function(){
 if(route.page==='eaImport'){
  document.getElementById('backBtn')?.classList.remove('hidden');
  document.getElementById('app').innerHTML=EA.importPage();return;
 }
 eaBatchPriorRender();
};
const eaBatchPriorBack=goBack;
goBack=function(){if(route.page==='eaImport')return nav('training');return eaBatchPriorBack()};
const eaBatchPriorExerciseView=exerciseView;
exerciseView=function(kind,exid){
 const html=eaBatchPriorExerciseView(kind,exid),ex=state.exercises?.[kind]?.find(x=>x.id===exid);
 if(!ex?.instructions)return html;
 return html+`<section class="ea-import-box" style="margin-top:14px"><h3>Instruções</h3><p style="white-space:pre-wrap">${esc(ex.instructions)}</p></section>`;
};
// Focos importados podem começar sem imagem; suas imagens poderão ser acrescentadas depois.
const eaBatchPriorFocusNowImage=loadFocusNowImage;
loadFocusNowImage=async function(fid){
 const f=EA.focusById(fid);
 if(f&&!focusImageIds(f).length){const holder=document.getElementById('focusVisual_'+fid);if(holder)holder.innerHTML='<span class="meta">Sem imagem. Adicione uma ilustração na Biblioteca de Focos.</span>';return}
 return eaBatchPriorFocusNowImage(fid)
};
const eaBatchPriorSaveFocus=saveFocus;
saveFocus=async function(fid){
 const f=EA.focusById(fid);
 if(f?.importRef&&!focusImageIds(f).length&&!focusDraftFiles.length){
  const title=document.getElementById('focusTitle')?.value.trim(),concept=document.getElementById('focusConcept')?.value.trim(),microSkill=document.getElementById('focusMicroSkill')?.value.trim(),courseUrl=document.getElementById('focusCourse')?.value.trim()||'';
  if(!title||!concept||!microSkill)return alert('Preencha nome, conceito e micro-habilidade.');
  if(!EA.validCourseUrl(courseUrl))return alert('Use um link http:// ou https://.');
  f.title=title;f.concept=concept;f.microSkill=microSkill;f.courseUrl=courseUrl;save();focusDraftFiles=[];nav('focusLibrary');return
 }
 return eaBatchPriorSaveFocus(fid);
};
/* END EA_BATCH_UI_v1 */

EA.installAudio();
render();
EA.openIntro();

</script>
</body>
</html>
